[package]
name = "citadel-workspace-server-kernel"
version = "0.1.0"
edition = "2021"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# localhost-testing = ["citadel_sdk/localhost-testing"]
# vendored = ["citadel-internal-service/vendored"]

[[bin]]
name = "citadel-workspace-server-kernel"
path = "src/main.rs"

[dependencies]
structopt = { workspace = true }
citadel_io = { workspace = true }
citadel_types = { workspace = true }
# The post-quantum sign-in settings a host starts the node with (`kernel::sign_in`).
citadel_user = { workspace = true }
citadel-workspace-types = { workspace = true }
citadel_logging = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = "0.22"
uuid = { workspace = true, features = ["v4"] }
async-trait = { workspace = true }
futures = { workspace = true }
bincode = "1.3.3"

# Extra dependencies
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
tokio-stream = "0.1"
log = "0.4"
auto_impl = "1.3.0"

tempfile = "3.10.1"
bcrypt = "0.17.0"
sha2 = "0.10"
subtle = "2.6"
# The Documents relay decodes CRDT updates and snapshots, and builds its own (see the root).
cdoc-crdt = { workspace = true }
# Secure-link tokens (kernel::secure_links::token): 32 bytes from the OS CSPRNG.
getrandom = "0.3"
chrono = { workspace = true }
# Citadel Apps (kernel::apps): the publisher's signature over a manifest and its wasm, the app
# id and version grammar, and the egress policy's URL and address rules for artifact fetches.
# Pure Rust, wasm32-unknown-unknown clean, as the tenant worker builds them already.
citadel-app-signature = { path = "../citadel-internal-service/citadel-app-signature" }
citadel-app-id = { path = "../citadel-internal-service/citadel-app-id" }
citadel-app-net-policy = { path = "../citadel-internal-service/citadel-app-net-policy" }
# The app runtime's server side (kernel::apps): the ABI's host calls and replies that `Call`
# carries, and the internal-HTTP frames the relay checks. Pure, no_std/wasm32 clean.
citadel-app-sdk-types = { path = "../citadel-internal-service/citadel-app-sdk-types" }
citadel-ihttp-types = { path = "../citadel-internal-service/citadel-ihttp-types" }
hex = "0.4"

# Native: the production server — SQLite backend, SIGTERM drain.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["macros", "rt", "signal"] }
citadel_sdk = { workspace = true, features = ["sql"] }
# The OPRF seed as `--init-sign-in-seed` makes it and the server reads it (kernel::sign_in::native).
zeroize = "1"
# Turnstile's siteverify (kernel::sign_in::native::siteverify): rustls with Mozilla's roots, as the
# agent's updater has it.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }

# wasm32: a server hosted by a JS runtime (a Workers Durable Object). No sqlx, no signals, no
# threads; tokio contributes only its runtime-free sync primitives and macros, and every spawn,
# timer and clock goes through `citadel_io`, which drives them from the host's event loop.
# `citadel_sdk` without its default `std`/`filesystem` features, as its own wasm tests build it.
[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.44.1", default-features = false, features = ["macros", "sync"] }
# `crypto.getRandomValues`, with the `getrandom_backend="wasm_js"` cfg the tenant worker sets.
getrandom = { version = "0.3", features = ["wasm_js"] }
citadel_sdk = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", rev = "eb9c0b75", default-features = false }

[dev-dependencies]
citadel_sdk = { workspace = true, features = ["localhost-testing", "multi-threaded"] }
citadel-internal-service = { path = "../citadel-internal-service/citadel-internal-service" }
citadel-internal-service-connector = { path = "../citadel-internal-service/citadel-internal-service-connector" }
citadel-internal-service-test-common = { path = "../citadel-internal-service/citadel-internal-service/tests/common" }
citadel-internal-service-types = { path = "../citadel-internal-service/citadel-internal-service-types" }
common = { path = "./tests/common", package = "citadel-workspace-server-kernel-test-common" }
# The signed support request, verified before the kernel serves it (support_reads_are_signed.rs).
citadel-support-signature = { path = "../citadel-support-signature" }

rstest = { workspace = true }
bincode = { workspace = true }
libc = "0.2"
