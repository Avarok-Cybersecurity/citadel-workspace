[package]
name = "citadel-workspace-server-kernel-test-common"
version = "0.1.0"
edition = "2021"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
citadel_sdk = { workspace = true, features = ["localhost-testing", "multi-threaded"] }
citadel_logging = { workspace = true }
citadel-workspace-server-kernel = { path = "../../" }
citadel-internal-service = { path = "../../../citadel-internal-service/citadel-internal-service" }
citadel-internal-service-types = { path = "../../../citadel-internal-service/citadel-internal-service-types" }
citadel-internal-service-connector = { path = "../../../citadel-internal-service/citadel-internal-service-connector" }
citadel-internal-service-test-common = { path = "../../../citadel-internal-service/citadel-internal-service/tests/common" }
citadel-workspace-types = { path = "../../../citadel-workspace-types" }
# Real CRDT updates for the Documents tests: the relay refuses bytes that do not decode.
cdoc-crdt = { workspace = true }


#rstest = { workspace = true }
#bincode = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
toml = "0.8"
uuid = { workspace = true }
# Each test server's sign-in seed (production_server.rs), in a directory of its own.
tempfile = "3.10.1"
