[package]
name = "citadel-workspace-types"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { workspace = true } # Added back with workspace inheritance
ts-rs = { version = "11", features = ["serde-compat", "uuid"] }
custom_debug = { version = "0.6.2" }
# Document integrity: the server hashes mdx_content on write and the client
# re-hashes before executing it. See DomainNode::mdx_content_hash.
sha2 = "0.10"
hex = "0.4"
citadel-internal-service-types = { path = "../citadel-internal-service/citadel-internal-service-types" }
# Citadel Apps: the app id grammar, the egress policy's host and method grammar, and the
# internal-HTTP limits, each defined once in the agent repository and read here.
citadel-app-id = { path = "../citadel-internal-service/citadel-app-id" }
citadel-app-net-policy = { path = "../citadel-internal-service/citadel-app-net-policy" }
citadel-ihttp-types = { path = "../citadel-internal-service/citadel-ihttp-types" }
# A manifest's icon is base64; it is decoded to check it is a PNG within its size cap.
base64 = "0.22"

[dev-dependencies]
# Only the credential-mirror test needs this; it reads the SDK's own constants
# rather than restating them, so the assertion cannot drift with the mirror.
citadel_user = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html