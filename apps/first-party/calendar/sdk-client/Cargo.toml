# citadel-calendar-sdk: what another app uses to add, change and read events in its member's
# Calendar (Calendar design §3.8). The requests and answers are calendar-core's `sdk` wire, so
# this crate and the Calendar cannot disagree; the calls themselves go over the app SDK's
# internal HTTP, which exists only in the wasm32 build, so the native build (the tests) is the
# wire alone.
[package]
name = "citadel-calendar-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calendar-core.workspace = true
citadel-app-sdk-types.workspace = true
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
citadel-app-sdk.workspace = true
