# Docker-specific Cargo.toml for citadel-workspace-server-kernel
# Removes dev-dependencies that cause localhost-testing feature unification
[package]
name = "citadel-workspace-server-kernel"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# localhost-testing = ["citadel_sdk/localhost-testing"]
# vendored = ["citadel-internal-service/vendored"]

[[bin]]
name = "citadel-workspace-server-kernel"
path = "src/main.rs"

[dependencies]
structopt = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
citadel_sdk = { workspace = true, features = ["sql"] }
citadel_types = { workspace = true }
citadel-workspace-types = { workspace = true }
citadel_logging = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
async-trait = { workspace = true }
futures = { workspace = true }
bincode = "1.3.3"

# Extra dependencies
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
tokio-stream = "0.1"
log = "0.4"
auto_impl = "1.3.0"

tempfile = "3.10.1"
bcrypt = "0.17.0"
chrono = { workspace = true }

# The constant-time master-password comparison (kernel/secret_eq.rs).
#
# These were added to the crate's real Cargo.toml and not here, and the Docker
# build REPLACES that manifest with this file — so the server image failed with
# `unresolved import sha2` / `unresolved import subtle` while `cargo build` at the
# repository root succeeded. The production server was unbuildable and nothing said
# so until a Playwright job tried to start the stack.
#
# scripts/check-docker-manifest-matches-the-crate.mjs now compares the two
# `[dependencies]` sections, because this file is a hand-maintained SECOND copy of
# a list that lives elsewhere and nothing else keeps them equal.
sha2 = "0.10"
subtle = "2.6"

# NOTE: dev-dependencies removed for Docker build to avoid localhost-testing feature
