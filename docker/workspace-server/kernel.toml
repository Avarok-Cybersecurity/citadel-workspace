# Workspace master password — set via WORKSPACE_MASTER_PASSWORD env var (preferred)
# or directly here for local development. Server refuses to start if empty.
bind_addr = "0.0.0.0:12349"
# Whether users must have accepted Avarok's platform terms before diagnostics can be switched on.
# False here: this server is self-hosted, so its users were never shown them. An Avarok-hosted
# tenant sets it true (deploy/tenant-worker/control/provisioning.mjs).
require_platform_terms = false
# TLS certificate verification — set to true ONLY for local development with self-signed certs.
dangerous_skip_cert_verification = false

# Backend type:
#   * Omit (default) for in-memory storage - this is the development
#     contract documented in CLAUDE.md (ephemeral state across `tilt`
#     reloads).
#   * Set `WORKSPACE_BACKEND=filesystem` and `WORKSPACE_DATA_DIR=/path`
#     env vars to enable persistent storage. Production deployments do
#     this in `docker-compose.production.yml`.
#
# A previous version of this file hard-coded `backend = "filesystem"`,
# which broke the ephemeral-dev contract because dev and prod share
# this baked-in config via the same Dockerfile COPY.

# Path to directory-based workspace content (recommended)
# The directory must contain:
#   - workspace.json: Workspace metadata
#   - Subdirectories: Each becomes an office
#   - Nested subdirectories: Each becomes a room
#   - CONTENT.md: Required for each office and room
content_base_dir = "./documents/defaults/root"

# Legacy: Path to workspace structure JSON (deprecated, use content_base_dir)
# workspace_structure = "./workspaces.json"

# =============================================================================
# File Transfer Configuration
# =============================================================================
[file_transfer]
# Enable server-mediated file transfers (async mode)
# When enabled, files can be uploaded to the server for later download
allow_server_file_transfer = true

# Enable RE-VFS (Remote Encrypted Virtual File System) storage
# When enabled, peers can store encrypted files on each other's devices
allow_server_revfs_storage = true

# Maximum file size for transfers (in megabytes)
# Users can set lower limits per-peer, but not exceed this value
max_file_transfer_size_mb = 100

# Default RE-VFS storage quota per peer (in megabytes)
# Users can adjust per-peer quotas via Chat Settings, but not exceed this value
revfs_storage_quota_mb = 100

# File transfer request TTL (in days)
# Pending transfer requests expire after this period
file_ttl_days = 7

# =============================================================================
# Documents (collaborative editing relay)
# =============================================================================
# Every key is required: the server refuses to start without this section.
[documents]
# The most updates one Pull returns; the client pulls again for the rest.
max_updates_per_pull = 64
# Updates held since the last snapshot before Appended asks a writer to compact.
snapshot_min_updates = 256
# The largest single CRDT update, and the largest snapshot, accepted (bytes).
max_update_bytes = 65536
max_snapshot_bytes = 4194304
# The largest awareness payload (cursor, selection, presence) relayed (bytes).
max_awareness_bytes = 4096
# Awareness payloads one session may send per second.
awareness_per_second = 20
# Appends and pulls one session may send per second.
appends_per_second = 50
pulls_per_second = 20
# Bytes of updates held since the last snapshot. At compact_at_pending_bytes the server builds
# and stores a snapshot itself; at max_pending_log_bytes appends are refused (LogFull) until one
# is stored. max_pending_log_bytes must exceed snapshot_min_updates * max_update_bytes (16 MiB
# here), and compact_at_pending_bytes must be below it.
compact_at_pending_bytes = 8388608
max_pending_log_bytes = 33554432
# Updates a snapshot covers are kept for this many sequence numbers behind it, then dropped.
retain_covered_updates_seqs = 256
# CRDT client ids (one per editing session) one document may bind to authors.
max_clients_per_document = 4096
# The largest request frame decoded at all (bytes); refused unread above it. Must exceed four
# times the largest payload cap above (JSON writes a byte as up to four characters): 16 MiB here.
max_request_frame_bytes = 17825792
