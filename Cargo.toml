[workspace]
members = [
    "citadel-workspace-server-kernel",
    "citadel-workspace-internal-service",
    "citadel-workspace-types",
    "citadel-workspace-executor",
    "citadel-workspace-server-kernel/tests/common",
]

exclude = ["./citadel-internal-service"]

resolver = "3"

# Release profile.
#
# `overflow-checks` is the point of this block. Cargo's default has it ON for
# `cargo test` (via debug-assertions) and OFF for `--release`, so an integer
# overflow panics in CI and wraps silently in every shipped binary. In a
# codebase of u64 CIDs, ticket counters, byte offsets, chunk indices and
# quotas, that is the divergence most likely to make a real bug pass the suite
# and then misbehave in production — the tests cannot reproduce the field
# failure because they are not running the same arithmetic.
#
# The cost is a bounds check on arithmetic that overflows; the benefit is that
# a wrap becomes a loud, located panic instead of a silently wrong CID or a
# quota that reads as satisfied.
[profile.release]
overflow-checks = true

[workspace.dependencies]
# Workspace-specific packages
citadel-workspace-server-kernel = { path = "./citadel-workspace-server-kernel" }
citadel-workspace-server-kernel-test-common = { path = "./citadel-workspace-server-kernel/tests/common" }
citadel-workspace-internal-service = { path = "./citadel-workspace-internal-service" }
citadel-workspace-types = { path = "./citadel-workspace-types" }
citadel-workspace-executor = { path = "./citadel-workspace-executor" }

# Secondary packages

# Secondary package (for dev purposes, use the local path at ./citadel-internal-service)

# Avarok deps
citadel_sdk = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", branch = "master" }
citadel_types = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", branch = "master" }
# Dev-only: the credential-mirror test reads MIN/MAX_{PASSWORD,USERNAME,NAME}_LENGTH
# directly, so a client-side mirror cannot drift from the SDK unnoticed.
citadel_user = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", branch = "master" }
citadel_logging = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", branch = "master" }

# Avarok deps (for dev purposes, use the local path at ../Citadel-Protocol)
#citadel_sdk = { path = "../Citadel-Protocol/citadel_sdk" }
#citadel_types = { path = "../Citadel-Protocol/citadel_types" }
#citadel_logging = { path = "../Citadel-Protocol/citadel_logging" }

# Tauri plugins
#tauri = { version = "2.4.1" }
#tauri-plugin-shell = { version = "2.2.1" }
#tauri-plugin-log = { version = "2.4.0" }
#tauri-build = { version = "2.1.1" }

# Generic dependencies
structopt = { version = "0.3.26" }
tokio = { version = "1.44.1", features = ["full"] }
tokio-util = { version = "0.7.14" }
parking_lot = { version = "0.12" }
lazy_static = { version = "1.5.0" }
uuid = { version = "1.16" }
serde = { version = "1.0.219" }
serde_json = { version = "1.0.140" }
futures = { version = "0.3.31" }
async-trait = { version = "0.1.88" }
async-recursion = { version = "1.0" }
rstest = { version = "0.25.0" }
bincode = "2.0.1"
chrono = { version = "0.4.34", features = ["serde"] }
