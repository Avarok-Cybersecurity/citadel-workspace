# The workspace protocol's codec for the page: JSON bytes <-> JS values, through the real
# citadel-workspace-types serde types, so a decode is checked against the types rather than
# cast to them, and which fields are u64 (BigInt on the page) comes from the types themselves.
# Its own workspace with a pinned compiler, as the Calendar's glue is, so the vendored binary
# rebuilds byte for byte (scripts/build-workspace-codec.mjs --check). wasm32-unknown-unknown only.
[workspace]
# parent/ mirrors the repository root with symlinks so every path dependency lies inside this
# workspace: Cargo hashes a path package's identity by its path relative to the workspace root
# when it lies inside that root, and by its ABSOLUTE path otherwise, and that hash reaches the
# codegen. Reached as "../citadel-workspace-types", the bytes depended on where the repository is
# checked out (apps/sdk-fixtures/Cargo.toml). parent/Cargo.toml is the root manifest, which the
# types crate inherits `workspace = true` keys from; `exclude` keeps the mirror from membership.
exclude = ["parent"]

[package]
name = "citadel-workspace-codec"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
citadel-workspace-types = { path = "parent/citadel-workspace-types" }
serde = "1.0.219"
serde_json = "1.0.140"
serde-wasm-bindgen = "0.6.5"
# Exactly the version of the wasm-bindgen CLI scripts/build-workspace-codec.mjs runs (it reads
# this from the lockfile and refuses any other): the glue and the binary are one build.
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
