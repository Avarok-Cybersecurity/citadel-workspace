# =============================================================================
# Citadel Workspace - Production Docker Compose
# =============================================================================
#
# Architecture:
#   Users → Cloudflare (TLS) → cloudflared tunnel → Docker network
#                                                     ├── ui (nginx:8080, non-root)
#                                                     ├── internal-service (ws:12345)
#                                                     └── server (citadel:12349)
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#   # Nothing is built: all three images are pulled from GHCR (see deploy.sh).
#
#   # With Cloudflare Tunnel, to serve the UI publicly:
#   TUNNEL_TOKEN=<your-token> docker compose -f docker-compose.production.yml --profile tunnel up -d
#
# THE UI SERVED HERE CANNOT REACH AN AGENT, BY DESIGN.
#
# The browser talks to the agent over a WebSocket, and the UI image can proxy that at a
# same-origin /ws. This stack sets WS_PROXY_ENABLED=0 to switch that proxy OFF, because the UI
# here is served PUBLICLY and the agent's socket is an unauthenticated control plane - proxying
# it from a public origin would expose it to the internet (an Origin check does not help; a
# non-browser client forges the header trivially). A hosted UI backed by one shared agent would
# also put every user's ratchet keys on the operator's machine, which defeats the E2E guarantee.
#
# Users therefore run the agent and UI on their OWN machine - see docker-compose.local.yml - and
# point it at the `server` hosted here. This stack's job is the SERVER. The `ui` and
# `internal-service` services are retained from the older centralized topology; if you are not
# using them, they are dead weight and can be dropped.
#
# nginx runs as the unprivileged `nginx` user on 8080 so it doesn't need root to bind; do NOT add
# CAP_NET_BIND_SERVICE — front it with a reverse proxy for 80/443.
#
# Required environment variables (set in .env or export):
#   WORKSPACE_MASTER_PASSWORD  - Master password for workspace initialization
#   INTERNAL_SERVICE_PORT      - Internal service port (default: 12345)
#
# Optional (production only):
#   TUNNEL_TOKEN               - Cloudflare Tunnel token (enables tunnel profile)
#
# Update procedure (zero-downtime, data-safe):
#   ./deploy.sh
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Workspace Server (Citadel Protocol)
  # Handles workspace CRUD, office/room management, member permissions
  # Data persisted to server_data volume
  # ---------------------------------------------------------------------------
  server:
    # Unbounded by default: the json-file driver keeps every line until the
    # disk fills, and nothing here rotates. Capped rather than disabled --
    # the logs are the only post-mortem evidence this stack produces.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Pull a prebuilt image from GHCR rather than compiling on the production
    # host. `IMAGE_TAG` defaults to `latest`; pin it to a `sha-<12-char-sha>` tag
    # to roll back to an exact prior build (see .github/workflows/publish-images.yml).
    #
    # `latest` is safe as a default because CI only advances it via a `promote-latest`
    # job that requires EVERY image in the release to have built AND passed its smoke
    # test, and only on master -- so it can never point at a half-published release or
    # at a manually-dispatched branch build. Pin an explicit SHA tag for a deploy you
    # need to be able to reproduce exactly.
    image: ghcr.io/avarok-cybersecurity/citadel-workspace-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./docker/workspace-server/Dockerfile
      # REQUIRED. `dev` is the last stage in that Dockerfile (so that the dev
      # compose file, which pins no target, keeps its toolchain image). Without
      # this line a local `docker compose build` would produce the 5.6 GB
      # toolchain image instead of the 142 MB runtime one.
      target: production
    volumes:
      - server_data:/data/server
    environment:
      # citadel=info alone silently deletes the entire ILM subsystem. EnvFilter
      # adds its ERROR default only when the parsed directive set is EMPTY, so a
      # non-empty `citadel=info` leaves every non-matching target off at EVERY
      # level -- including error!. That drops all 85 `target: "ism"` lines, of
      # which 28 are error! and 23 are warn!, and they are precisely the ones
      # that answer "my message never arrived": [ILM-SEND] FAILED, "Peer not
      # connected, skipping N messages", and the three "processing task
      # prematurely ended" lines that are the only record of a dead background
      # task. Verified against live logs: 0 matches in 5000 lines.
      #
      # citadel_crypt=warn because double-ratchet internals were 76% of the
      # log (2285 of 3000 lines), which is what made the remaining signal
      # unreadable rather than merely verbose.
      - RUST_LOG=citadel=info,ism=info,citadel_crypt=warn
      - WORKSPACE_MASTER_PASSWORD=${WORKSPACE_MASTER_PASSWORD}
      # Explicitly off, and stated rather than left to the default: the first
      # account to connect must NOT become the administrator. Registration has
      # no invite gate, so on a public bind that is a race any stranger can
      # win. The operator claims ownership through the initialization flow with
      # WORKSPACE_MASTER_PASSWORD instead. See docs/INSTALL.md.
      - WORKSPACE_ALLOW_FIRST_CONNECT_ADMIN=0
      # Persistence is opt-in via env vars so the same `kernel.toml`
      # baked into the Docker image stays ephemeral by default for
      # `tilt`-driven dev. Production sets both vars below to mount
      # workspace state on the `server_data` volume defined above.
      - WORKSPACE_BACKEND=filesystem
      - WORKSPACE_DATA_DIR=/data/server
      # Which interface the Citadel listener binds to.
      #
      # Defaults to loopback, which is correct for the co-located-cloudflared
      # topology: the tunnel reaches the server over the host loopback, and a
      # 0.0.0.0 bind would additionally expose it on the host's public
      # interfaces, bypassing the Cloudflare boundary.
      #
      # It is now overridable because the local-agent topology needs the
      # opposite: each user runs their own agent on their own machine and dials
      # this server DIRECTLY over the internet, so it must bind 0.0.0.0. Set
      # `WORKSPACE_BIND_ADDR=0.0.0.0:12349` in .env for that deployment, and put
      # a host firewall in front of the port. The Citadel protocol is E2E
      # encrypted, so a public bind is by design in that mode.
      - WORKSPACE_BIND_ADDR=${WORKSPACE_BIND_ADDR:-127.0.0.1:12349}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    restart: unless-stopped
    healthcheck:
      # Probe the port the server was TOLD to bind, not a literal. A tenant provisioned on
      # any other port (provision-tenant.sh allocates them) ran forever "unhealthy" against
      # 12349 while answering registrations on its real port, and deploy.sh's health wait
      # timed out on a working server. `$$` keeps Compose from interpolating at parse time;
      # the container's shell expands WORKSPACE_BIND_ADDR (host:port) to its port.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $${WORKSPACE_BIND_ADDR##*:}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    network_mode: host

  # ---------------------------------------------------------------------------
  # Internal Service (Session Management / P2P Relay)
  # Manages WebSocket connections, Citadel SDK sessions, P2P channels
  # Data persisted to internal_service_data volume
  #
  # Uses host networking because the Citadel SDK connects to workspace servers
  # using the address the user typed (e.g., localhost:12349). In bridge mode,
  # localhost resolves to the container's own loopback, not the server container.
  # Host networking ensures the internal service can reach the server at the
  # same address the user specified.
  # ---------------------------------------------------------------------------
  internal-service:
    # Unbounded by default: the json-file driver keeps every line until the
    # disk fills, and nothing here rotates. Capped rather than disabled --
    # the logs are the only post-mortem evidence this stack produces.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Prebuilt image from GHCR; see the `server` service above for the IMAGE_TAG
    # pinning / rollback contract.
    image: ghcr.io/avarok-cybersecurity/citadel-workspace-internal-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./docker/internal-service/Dockerfile
      # REQUIRED - see the `server` service. Without it a local build produces
      # the 4.5 GB toolchain image rather than the 145 MB runtime one.
      target: production
      args:
        - INTERNAL_SERVICE_PORT=${INTERNAL_SERVICE_PORT:-12345}
    volumes:
      - internal_service_data:/data/internal-service
    environment:
      # citadel=info alone silently deletes the entire ILM subsystem. EnvFilter
      # adds its ERROR default only when the parsed directive set is EMPTY, so a
      # non-empty `citadel=info` leaves every non-matching target off at EVERY
      # level -- including error!. That drops all 85 `target: "ism"` lines, of
      # which 28 are error! and 23 are warn!, and they are precisely the ones
      # that answer "my message never arrived": [ILM-SEND] FAILED, "Peer not
      # connected, skipping N messages", and the three "processing task
      # prematurely ended" lines that are the only record of a dead background
      # task. Verified against live logs: 0 matches in 5000 lines.
      #
      # citadel_crypt=warn because double-ratchet internals were 76% of the
      # log (2285 of 3000 lines), which is what made the remaining signal
      # unreadable rather than merely verbose.
      - RUST_LOG=citadel=info,ism=info,citadel_crypt=warn
      - DOCKER_CONTAINER=1
      - SKIP_WASM_BUILD=1
      - INTERNAL_SERVICE_PORT=${INTERNAL_SERVICE_PORT:-12345}
      # With `network_mode: host`, bind the WebSocket control plane to
      # loopback so it is reachable only by the co-located cloudflared /
      # nginx and NOT exposed on the host's public interfaces (which
      # `0.0.0.0` would, bypassing the Cloudflare TLS boundary). Override
      # only if your ingress reaches the service over a non-loopback host
      # interface (then add a host firewall blocking the port publicly).
      - INTERNAL_SERVICE_BIND_HOST=127.0.0.1
      # Persistence is opt-in via env vars so the same Dockerfile baked
      # into the image stays ephemeral by default for dev (`tilt`).
      # Production sets both vars below to mount internal-service state
      # on the `internal_service_data` volume defined above.
      - INTERNAL_SERVICE_BACKEND=filesystem
      - INTERNAL_SERVICE_DATA_DIR=/data/internal-service
      # Which pages may open a control connection to the agent. A WebSocket is
      # exempt from the same-origin policy and from CORS preflight, so without
      # this any page the user visits could drive this agent. The binary refuses
      # to start unless it is set, and `*` disables the check entirely.
      #
      # This MUST be the origin the UI is actually served from in this
      # deployment — scheme, host and port, no trailing slash. It is left
      # unset here on purpose so that a deployment that has not stated its own
      # origin fails loudly at startup rather than silently accepting every
      # page on the internet.
      #
      # Passed through with NO default and NO `:?` guard. The `:?` form would
      # make `docker compose config --services` — a pure metadata read used by
      # scripts/select-deploy-services.sh and by CI's drift guard — fail for
      # anyone who has not exported it. The fail-fast belongs one layer down:
      # the binary refuses to start on an empty value and names the variable.
      - INTERNAL_SERVICE_ALLOWED_ORIGINS=${INTERNAL_SERVICE_ALLOWED_ORIGINS}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    restart: unless-stopped
    # Same `nc -z` pattern as the server healthcheck above. The
    # previous `netstat | grep ":$PORT"` form had two failure modes:
    # `:12345` matches `:123450` and `:112345` as substrings (false
    # positives if some other process binds an unrelated port that
    # happens to contain the digits), and the `$$` escape is awkward
    # to maintain. `nc -z` is exact-port and ships in the same image.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "${INTERNAL_SERVICE_PORT:-12345}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      server:
        condition: service_healthy
    network_mode: host

  # ---------------------------------------------------------------------------
  # UI (React Frontend - Production Build)
  # Vite build served via nginx
  # ---------------------------------------------------------------------------
  ui:
    # Unbounded by default: the json-file driver keeps every line until the
    # disk fills, and nothing here rotates. Capped rather than disabled --
    # the logs are the only post-mortem evidence this stack produces.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Prebuilt from GHCR, like the other two. There is deliberately NO `build:` block: with both
    # `image:` and `build:` present, Compose builds locally and the published image - the one the
    # release gate verified and the one carrying the nginx config - is silently bypassed. The
    # image needs no per-environment build anyway: the app derives its socket URL from
    # window.location at runtime, so one published image serves every deployment.
    image: ghcr.io/avarok-cybersecurity/citadel-workspace-ui:${IMAGE_TAG:-latest}
    environment:
      # THE AGENT PROXY IS OFF HERE, AND MUST STAY OFF.
      #
      # This stack serves the UI publicly (that is what the `cloudflared` profile below does).
      # The agent's WebSocket is an UNAUTHENTICATED control plane - whoever reaches it drives the
      # user's sessions - so proxying it from a public origin would hand it to the internet. An
      # Origin check does not save you: WebSockets carry no CORS preflight and a non-browser
      # client forges the header with a single curl flag. The only sound control is not to proxy
      # it at all from a publicly-served UI.
      #
      # A hosted UI backed by one shared agent is also incompatible with the product's threat
      # model: that agent would hold EVERY user's ratchet keys, so the operator could read all
      # P2P traffic. Users run their own agent locally instead - see docker-compose.local.yml,
      # which is where /ws is both safe and enabled.
      - WS_PROXY_ENABLED=0
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped
    # `wget` is part of the nginx:stable-alpine base. `--spider` does a
    # HEAD-equivalent request that exits 0 only on 2xx — so this fails
    # if nginx isn't bound, if the SPA dist/ is missing (`/` would 404),
    # or if the config block returns an error page. `container_name`-style
    # probes that only check the container is "running" miss every one
    # of those modes; without this the cloudflared dependency below
    # would start before nginx is actually serving traffic.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      internal-service:
        condition: service_healthy
      server:
        condition: service_healthy
    network_mode: host

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel (Production only)
  # Exposes services to the internet via Cloudflare's network
  # Activate with: --profile tunnel
  #
  # Setup:
  #   1. Create a tunnel in Cloudflare Zero Trust dashboard
  #   2. Add ONE public hostname rule:
  #      - yourdomain.com      → http://localhost:8080
  #
  #      DO NOT add a `/ws*` rule to the agent on :12345.
  #
  #      These steps used to instruct exactly that, which contradicted the
  #      capitalised warning at the top of this file: the agent's control plane
  #      is unauthenticated, it holds every connected user's ratchet keys, and
  #      a tunnel rule reaches it directly — bypassing nginx and the fail-closed
  #      WS_PROXY_ENABLED switch that exists to stop precisely this. The switch
  #      was added to close that door; the setup steps quietly reopened it one
  #      layer down. Each user runs their own agent locally; nothing about this
  #      deployment needs a public one.
  #
  #      (Docker service names like `ui:8080` would only resolve on
  #      a bridge network — this compose file uses `network_mode:
  #      host` for every service including cloudflared, so the
  #      tunnel reaches the backends through the shared host
  #      loopback. Pointing the rules at the service-name hostnames
  #      would silently fail to connect.)
  #   3. Copy the tunnel token
  #   4. Set TUNNEL_TOKEN in .env
  # ---------------------------------------------------------------------------
  cloudflared:
    # Unbounded by default: the json-file driver keeps every line until the
    # disk fills, and nothing here rotates. Capped rather than disabled --
    # the logs are the only post-mortem evidence this stack produces.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Pinned, not `latest`. The three images above may sit on `latest` because CI
    # only advances that tag through a `promote-latest` job requiring every image in
    # the release to have built AND passed its smoke test. No such gate exists for a
    # third-party tag: `cloudflare/cloudflared:latest` is whatever Cloudflare last
    # pushed, and `restart: unless-stopped` plus a pull on the next host reboot would
    # swap the process terminating the public tunnel without anyone choosing to.
    # That also contradicts this file's own instruction to pin an explicit tag for a
    # deploy you need to reproduce exactly -- which is unachievable while one service
    # floats. Bump deliberately; releases are at github.com/cloudflare/cloudflared.
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-2026.8.3}
    # `--metrics 127.0.0.1:2000` exposes cloudflared's built-in /ready
    # endpoint so the healthcheck below can verify the tunnel actually
    # established a connection. Without it, an invalid token / network
    # failure leaves the container in "running" but traffic is
    # black-holed; operators reading `docker compose ps` see a healthy
    # stack with no signal. Bound to LOOPBACK (not 0.0.0.0) because under
    # network_mode: host a 0.0.0.0 bind would publish this unauthenticated
    # metrics endpoint on the host's public interfaces; the healthcheck
    # only needs to reach it over localhost.
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run
    environment:
      # Empty default so `docker compose build`/`config` works without the
      # tunnel profile (compose interpolates this even when cloudflared isn't
      # being started). The required-token fail-fast lives in deploy.sh, which
      # knows when the tunnel profile is actually requested — a `:?` here would
      # break every non-tunnel build/config.
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    # Match the resource discipline of the other services so a
    # misbehaving cloudflared process (memory leak, runaway CPU on
    # tunnel reconnect storms) can't starve the host. Numbers chosen
    # to match `ui`'s budget — cloudflared is similarly lightweight
    # (just relays bytes between Cloudflare's edge and localhost).
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped
    # `/ready` returns HTTP 200 once the tunnel is up and a 5xx (or no
    # response) otherwise. Probe the HTTP status with `--spider` (exits 0
    # only on 2xx) rather than grepping the JSON body for `"status":200`:
    # the body match is brittle to whitespace/field-order changes across
    # cloudflared versions, which would falsely report the tunnel
    # unhealthy. wget is in the cloudflared image's base.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2000/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      ui:
        condition: service_healthy
      # NOT internal-service: the tunnel serves the UI only, and waiting on the
      # agent implied a route to it that must not exist (see the setup steps).
    network_mode: host
    profiles:
      - tunnel

# =============================================================================
# Volumes - persist across container rebuilds and restarts
# =============================================================================
volumes:
  # Application data (NEVER delete these unless you want to lose all data)
  server_data:
  internal_service_data:
  # NOTE: the `target_cache` build-cache volume is gone. The production images
  # are now slim runtime stages that contain no cargo, no source and no
  # `target/` directory, so there was nothing left for it to cache -- it only
  # existed to speed up in-container rebuilds of the old 5.6 GB toolchain image.
  # The dev compose file still has its own, which is where it belongs.
