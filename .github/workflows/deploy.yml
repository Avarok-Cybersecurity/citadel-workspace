# Deploys work.avarok.net -- the tenant Worker, its Durable Object server and the UI -- and makes
# sure the agent people download is the one that deployment expects, in that order:
#
#   master passes validation in Publish Images, whose `deploy` job then starts this run
#     -> plan:    still master's head? is the agent this commit builds already released?
#                 (scripts/agent-release-state.mjs) If not, tag agent-vX.Y.Z here.
#     -> release: publish that tag (release-agent.yml), notarised, attested, every asset the UI
#                 links present
#     -> deploy:  deploy/tenant-worker/deploy.sh (its own gates, D1 migrations, smoke)
#     -> verify:  the latest release IS this commit's agent, its downloads resolve, the site answers
#
# The site used to be deployed by hand from an integration branch while the agent download stayed
# at whatever was last tagged: two days of agent fixes ran live on a locally built agent nobody
# could download. Here the site cannot go out ahead of its agent: a changed agent with an unbumped
# version fails `plan` (and fails the PR earlier, in Validate), and `deploy` waits on the release.
#
# Started after VALIDATION, not after the image publish. This ran on `workflow_run` of the whole
# Publish Images run, so every deploy also waited for the three image builds, their smoke tests
# and both registry pushes -- none of which deploy.sh reads (it deploys a Worker and a UI bundle;
# no Docker, no GHCR). Publish Images' `deploy` job dispatches this with the validated commit as
# soon as validation passes (or the gate proved the tree validated), in parallel with the publish.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'The master commit to deploy (Publish Images passes the validated one). Empty: the dispatched ref.'
        required: false
        type: string

# One deploy at a time, and never cancelled halfway: a cancelled deploy can leave the Worker and
# the release out of step, which is the state this workflow exists to prevent.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The head check, the release decision and the tag, in one job: they were two runner
  # acquisitions in a row (~30 s of work behind ~10 min of queue in a saturated pool).
  plan:
    name: Plan (is the agent released?)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the agent-v* tag, created only when the plan says a release is due
    outputs:
      state: ${{ steps.state.outputs.state }}
      version: ${{ steps.state.outputs.version }}
      tag: ${{ steps.state.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: The commit asked for is a full commit id
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$SHA' is not a 40-character commit id"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0 # the agent-v* tags and the history between them
      - id: sha
        name: The commit being deployed is still master's head
        # A slower run for an older commit must not deploy over a newer one.
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse origin/master)"
          if [ "$SHA" != "$head" ]; then
            echo "::error::$SHA is no longer master's head ($head); the run for the newer commit deploys instead."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - id: state
        run: node scripts/agent-release-state.mjs
      - name: A changed agent carries a new version
        if: steps.state.outputs.state == 'needs-bump'
        run: |
          echo "::error::The agent changed since its last release but its version did not. Bump citadel-workspace-internal-service/Cargo.toml; nothing was deployed."
          exit 1
      - name: Create the release tag at the deployed commit
        if: steps.state.outputs.state == 'needs-release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.state.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          # Idempotent for a re-run: the tag may exist already, but only at this commit.
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null)"; then
            [ "$existing" = "$SHA" ] || { echo "::error::$TAG already exists at $existing, not $SHA"; exit 1; }
            echo "$TAG already at $SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" >/dev/null
            echo "created $TAG at $SHA"
          fi

  release:
    name: Release the agent
    needs: plan
    if: needs.plan.outputs.state == 'needs-release'
    uses: ./.github/workflows/release-agent.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      publish: true
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write

  deploy:
    name: Deploy the site
    needs: [plan, release]
    # After the release, or with no release needed; never after a failed or skipped-by-failure one.
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.release.result == 'success' || (needs.release.result == 'skipped' && needs.plan.outputs.state == 'released'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/tenant-worker/package-lock.json
      - name: Rust with the wasm32 target
        run: rustup target add wasm32-unknown-unknown
      # The release binary, checksum-pinned, instead of `cargo install` compiling it from source on
      # every deploy (minutes of a 45-minute budget). Same version as before.
      - name: wasm-pack
        timeout-minutes: 5
        env:
          WASM_PACK_VERSION: 0.13.1
          WASM_PACK_SHA256: c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539
        run: |
          set -euo pipefail
          name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          dir="$RUNNER_TEMP/wasm-pack"
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 120 \
            -o "$dir/$name.tar.gz" \
            "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/$name.tar.gz"
          echo "$WASM_PACK_SHA256  $dir/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/$name.tar.gz" -C "$dir"
          install -m 0755 "$dir/$name/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version | grep -qx "wasm-pack $WASM_PACK_VERSION"
      - name: UI dependencies
        timeout-minutes: 15
        run: npm ci --no-audit --no-fund
      - name: deploy.sh
        env:
          CF_TOKEN: ${{ secrets.CITADEL_CF_DEPLOY_TOKEN }}
          STRIPE_KEY: ${{ secrets.STRIPE_TEST_RESTRICTED_KEY }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::the CITADEL_CF_DEPLOY_TOKEN secret is not set"; exit 1; }
          [ -n "$STRIPE_KEY" ] || { echo "::error::the STRIPE_TEST_RESTRICTED_KEY secret is not set"; exit 1; }
          umask 077
          printf '%s' "$CF_TOKEN" > "$RUNNER_TEMP/cf-token"
          # The file format scripts/stripe-catalogue.mjs reads: a STRIPE_SECRET_KEY= line, not the bare key.
          printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_KEY" > "$RUNNER_TEMP/stripe-key"
          CITADEL_CF_TOKEN_FILE="$RUNNER_TEMP/cf-token" CITADEL_STRIPE_KEY_FILE="$RUNNER_TEMP/stripe-key" \
            deploy/tenant-worker/deploy.sh
          rm -f "$RUNNER_TEMP/cf-token" "$RUNNER_TEMP/stripe-key"

  verify:
    name: The site and the download agree
    needs: [plan, deploy]
    # Explicit, like deploy's: a job with no `if` is skipped when ANY job upstream of it was, and
    # `release` is skipped on every deploy whose agent is already out. Without this the run
    # reported success while this check never ran (run 36304511815).
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The latest release is this commit's agent, and its downloads resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [ "$latest" = "$TAG" ] || { echo "::error::the latest release is $latest, not $TAG: the UI's download links would serve the wrong agent"; exit 1; }
          for asset in Citadel-Agent.dmg Citadel-Agent-x64.msi citadel-agent-linux-x64.deb Citadel-Agent-x86_64.AppImage; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -L "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$asset")"
            [ "$code" = 200 ] || { echo "::error::$asset answered $code"; exit 1; }
            echo "ok $asset"
          done
      - name: The site answers
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://work.avarok.net/version.json
