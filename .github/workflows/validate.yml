name: Validate PR
on:
  workflow_call:
  pull_request:
  push:
    branches: ["master"]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # 40 MiB stack
  RUST_MIN_STACK: 40971520
  RUST_LOG: "citadel=warn"
  # Skip WASM build in CI (no wasm-pack installed)
  SKIP_WASM_BUILD: "1"

jobs:
  fmt:
    name: Cargo Fmt - ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - citadel-workspace-types
          - citadel-workspace-internal-service
          - citadel-workspace-server-kernel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - name: Run Cargo Fmt
        run: cargo fmt -p ${{ matrix.crate }} --check

  clippy:
    name: Cargo Clippy - ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - citadel-workspace-types
          - citadel-workspace-internal-service
          - citadel-workspace-server-kernel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - name: Run Cargo Clippy
        run: cargo clippy -p ${{ matrix.crate }} -- -D warnings

  # The citadel-internal-service workspace, covered WHOLESALE rather than
  # crate-by-crate.
  #
  # Its 7 members had no fmt or clippy job at all: the matrices above name only
  # the root workspace's crates, so a committed file failed `cargo fmt --check`
  # in intersession-layer-messaging while every run stayed green. Nobody removed
  # a check — the check never looked there.
  #
  # `--all` / `--workspace` rather than another crate list, deliberately: a list
  # is the thing that drifted, and it drifts silently every time a crate is
  # added. This covers members that do not exist yet.
  # Cheap, first-class, and deliberately NOT inside another job's matrix: the
  # existing doc gate hangs off `if: matrix.project == 'citadel-workspaces'`,
  # so renaming that matrix leg would silently take the gate with it — the same
  # class of disappearance this job exists to detect.
  crate-coverage:
    name: Every workspace crate has a lint job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check crate coverage
        run: node scripts/check-crate-coverage.mjs
      - name: Check the docs' commands resolve
        run: node scripts/check-doc-commands.mjs
      - name: "Check verify: annotations still hold"
        run: node scripts/check-doc-assertions.mjs
      - name: Check the quickstart works on a clean clone
        run: node scripts/check-doc-setup-steps.mjs
      - name: Check icon-only buttons have accessible names
        run: node scripts/check-icon-button-names.mjs
      - name: Check destructive text clears AA on every background
        run: node scripts/check-destructive-contrast.mjs
      - name: Check no storage key is read but never written
        run: node scripts/check-storage-keys.mjs
      - name: Check the Permission enum matches between Rust and TypeScript
        run: node scripts/check-permission-parity.mjs
      - name: Check no control is revealed by hover alone
        run: node scripts/check-hover-only-controls.mjs
      - name: Check every service declares a restart policy
        run: node scripts/check-restart-policies.mjs
      - name: Check no control loses its name at narrow widths
        run: node scripts/check-responsive-label-loss.mjs
      - name: Check every colour utility resolves to a defined token
        run: node scripts/check-color-tokens-exist.mjs
      - name: Check message senders come from the transport, not the payload
        run: node scripts/check-sender-identity.mjs

  internal-service-rust-lint:
    name: Cargo Fmt + Clippy - citadel-internal-service workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - name: Run Cargo Fmt
        run: cargo fmt --all --check
        working-directory: citadel-internal-service
      - name: Run Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: citadel-internal-service

  rust-tests:
    name: Rust Tests - ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - citadel-workspace-types
          - citadel-workspace-internal-service
          - citadel-workspace-server-kernel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - name: Run Cargo Test
        run: cargo test -p ${{ matrix.crate }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Workspace Dependencies
        # Install from root to resolve file: dependencies between workspaces
        run: npm ci
      - name: Build citadel-internal-service typescript-client
        # Build the WASM client's TypeScript wrapper first (innermost dependency)
        run: npm run build
        working-directory: citadel-internal-service/typescript-client
      - name: Build citadel-workspace-client-ts
        # Build client-ts to generate dist/ with TypeScript declarations
        run: npm run build
        working-directory: citadel-workspace-client-ts
      - name: Install Vitest
        # Ensure vitest is available at root for workspace to use
        run: npm install vitest@3.0.7 --save-dev
      - name: Run Unit Tests
        # Run vitest directly to avoid npm -w matching nested integration-tests workspace
        run: npx vitest run
        working-directory: citadel-workspaces

  typecheck:
    name: TypeScript Type Check - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: citadel-workspaces
            path: citadel-workspaces
          - project: citadel-workspace-client-ts
            path: citadel-workspace-client-ts
          - project: integration-tests
            path: citadel-workspaces/integration-tests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Workspace Dependencies
        # Install from root to resolve file: dependencies between workspaces
        run: npm ci
      - name: Build citadel-internal-service typescript-client
        # Build the WASM client's TypeScript wrapper first (innermost dependency)
        # Now part of npm workspaces, so deps installed by root npm ci
        run: npm run build
        working-directory: citadel-internal-service/typescript-client
      - name: Build citadel-workspace-client-ts
        # Build client-ts to generate dist/ with TypeScript declarations
        run: npm run build
        working-directory: citadel-workspace-client-ts
      - name: Run Type Check
        run: |
          if [ "${{ matrix.project }}" = "citadel-workspaces" ]; then
            # Run from root for bundler moduleResolution (needs hoisted react)
            npx tsc -p ${{ matrix.path }}/tsconfig.app.json --noEmit
          elif [ "${{ matrix.project }}" = "integration-tests" ]; then
            # Symlink playwright for NodeNext resolution
            mkdir -p ${{ matrix.path }}/node_modules
            ln -sf ${{ github.workspace }}/node_modules/playwright ${{ matrix.path }}/node_modules/playwright
            npm run typecheck -w cw-integration-tests
          else
            npm run typecheck -w ${{ matrix.project }}
          fi
      - name: Enforce 250-line file limit
        if: matrix.project == 'citadel-workspaces'
        run: |
          # Skip list: generated/external files exempt from 250-line limit
          # Files that pre-date the 250-line cap and already exceed
          # it. The cap was introduced after they were written; this
          # PR is not the right place to refactor them. Tracked as
          # known violations so the cap still keeps NEW files in
          # check. Mirrors the equivalent allowlist in the
          # citadel-workspaces submodule's own validate.yml.
          SKIP_FILES=(
            "components/ui/sidebar.tsx"
            "components/layout/sidebar/TreeNodesSection.tsx"
            "components/p2p/ChatSettingsPanel.tsx"
            "lib/file-transfer/service.ts"
            "pages/Landing.tsx"
            "types/messaging-layer.ts"
            "types/workspace-protocol.ts"
          )

          VIOLATIONS=0
          while IFS= read -r file; do
            rel="${file#citadel-workspaces/src/}"
            skip=false
            for s in "${SKIP_FILES[@]}"; do
              if [ "$rel" = "$s" ]; then skip=true; break; fi
            done
            if $skip; then continue; fi

            lines=$(wc -l < "$file")
            if [ "$lines" -gt 250 ]; then
              echo "::error file=$file::$file has $lines lines (limit: 250)"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          # Tests are excluded on purpose. The cap exists to stop a MODULE
          # accreting responsibilities; a test file's length measures how many
          # cases are covered, which is the opposite signal. Splitting one
          # scatters assertions about a single unit across files and makes the
          # set harder to read, not easier.
          done < <(find citadel-workspaces/src -type f \( -name '*.ts' -o -name '*.tsx' \) ! -name '*.bak' ! -path '*/__tests__/*')

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "FAIL: $VIOLATIONS file(s) exceed the 250-line limit"
            exit 1
          fi
          echo "All TypeScript files within 250-line limit"

  lint:
    name: ESLint - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: citadel-workspaces
            path: citadel-workspaces
          - project: citadel-workspace-client-ts
            path: citadel-workspace-client-ts
          - project: integration-tests
            path: citadel-workspaces/integration-tests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Workspace Dependencies
        # Install from root to resolve file: dependencies between workspaces
        run: npm ci
      - name: Build citadel-internal-service typescript-client
        # Build the WASM client's TypeScript wrapper first (innermost dependency)
        run: npm ci && npm run build
        working-directory: citadel-internal-service/typescript-client
      - name: Build citadel-workspace-client-ts
        # Build client-ts to generate dist/ with TypeScript declarations
        run: npm run build
        working-directory: citadel-workspace-client-ts
      - name: Install ESLint at root (workspaces hoisting issue)
        # Workspaces may hoist eslint to workspace dirs instead of root
        run: npm install eslint@9.39.2 --save-dev
      - name: Run ESLint
        # Symlink hoisted packages and use root eslint binary via .bin
        run: |
          mkdir -p node_modules/@eslint
          ln -sf ${{ github.workspace }}/node_modules/@eslint/js node_modules/@eslint/js
          ln -sf ${{ github.workspace }}/node_modules/globals node_modules/globals
          ln -sf ${{ github.workspace }}/node_modules/typescript-eslint node_modules/typescript-eslint
          ${{ github.workspace }}/node_modules/.bin/eslint . --max-warnings 0
        working-directory: ${{ matrix.path }}

      - name: Documented env vars have consumers
        # A deployment doc is the one place a reader cannot verify a claim by
        # running it. A variable named there but read by nothing looks like a
        # security control you can switch on: set it, and the service keeps its
        # default while the runbook says it is locked down.
        if: matrix.project == 'citadel-workspaces'
        run: ./scripts/check-doc-env-vars.sh
        working-directory: .

  integration-tests:
    name: Integration Test - ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: test:p2p
            artifact: p2p
          - test: test:live-doc
            artifact: live-doc
          - test: test:group
            artifact: group
          - test: test:group-multiuser
            artifact: group-multiuser
          - test: test:crud
            artifact: crud
          - test: test:prev-sessions
            artifact: prev-sessions
          - test: test:file-transfer
            artifact: file-transfer
          - test: test:offline
            artifact: offline
          - test: test:hard-disconnect
            artifact: hard-disconnect
          - test: test:permissions
            artifact: permissions
          - test: test:admin-modal
            artifact: admin-modal
          - test: test:security
            artifact: security
          - test: test:topbar
            artifact: topbar
          - test: test:p2p-types
            artifact: p2p-types
          - test: test:settings-controls
            artifact: settings-controls
          - test: test:directory-actions
            artifact: directory-actions
          - test: test:member-mgmt
            artifact: member-mgmt
          - test: test:group-extended
            artifact: group-extended
          - test: test:files-extended
            artifact: files-extended
          - test: test:mdx-content
            artifact: mdx-content
          - test: test:misc
            artifact: misc
          - test: test:account-mgmt
            artifact: account-mgmt
          - test: test:hierarchy-nav
            artifact: hierarchy-nav
          # The tree specs ran in NO CI job at all. Seven of them had npm
          # scripts and none was in this matrix, so the workspace hierarchy —
          # including the permission checks that verify a member cannot create
          # or delete tree structure — was never exercised on a PR.
          - test: test:tree-validator
            artifact: tree-validator
          - test: test:tree-cascade
            artifact: tree-cascade
          - test: test:tree-structure
            artifact: tree-structure
          - test: test:tree-permissions
            artifact: tree-permissions
          - test: test:tree-deep
            artifact: tree-deep
          - test: test:tree-move
            artifact: tree-move
          - test: test:tree-custom-types
            artifact: tree-custom-types
          # Specs that existed with an npm script but were never in this matrix,
          # so they had never run in CI. Each was verified passing locally before
          # being added here — an unverified entry just turns the pipeline red.
          - test: test:chat-settings
            artifact: chat-settings
          - test: test:directory
            artifact: directory
          - test: test:file-manager
            artifact: file-manager
          - test: test:notifications
            artifact: notifications
          - test: test:settings
            artifact: settings
          - test: test:workspace-init
            artifact: workspace-init
          - test: test:revfs:peer
            artifact: revfs-peer
          - test: test:revfs:server
            artifact: revfs-server
          # Group chat, plus the five reconnection specs. These had scripts but
          # no matrix entry, so the reconnection paths — C2S drop, P2P drop, and
          # the combinations — had never been exercised by CI at all.
          - test: test:peer-group
            artifact: peer-group
          - test: test:office-chat
            artifact: office-chat
          - test: test:room-chat
            artifact: room-chat
          # native-file-picker had no npm script at all, so it was invisible to
          # both CI and `npm run` — the only spec in the suite with neither.
          - test: test:native-file-picker
            artifact: native-file-picker
          - test: test:reconnect-c2s
            artifact: reconnect-c2s
          - test: test:reconnect-p2p-only
            artifact: reconnect-p2p-only
          - test: test:reconnect-one-c2s
            artifact: reconnect-one-c2s
          - test: test:reconnect-both-c2s
            artifact: reconnect-both-c2s
          - test: test:reconnect-p2p-one-c2s
            artifact: reconnect-p2p-one-c2s
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free Disk Space
        run: |
          # Remove unnecessary pre-installed tools (frees 10-20 GB)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        # Run `npm ci` at the workspace root so playwright is installed
        # ONCE (hoisted at root) instead of being installed both at root
        # AND at citadel-workspaces/node_modules — the latter causes
        # `tsc` to see two distinct `playwright-core/types/types`
        # locations and fail every test build with:
        #   Type 'X/playwright-core/.../Browser' is not assignable to
        #   type 'Y/playwright-core/.../Browser'
        # plus `Property 'toBeVisible' does not exist on type
        # 'MakeMatchers<…>'` because the wrong `@playwright/test`
        # `expect` augmentation gets picked up. Installing once at
        # root unifies module resolution.
        #
        # IMPORTANT: install deps BEFORE `playwright install`. Running
        # `npx playwright install` first triggers npx to auto-fetch the
        # *latest* playwright, which downloads chrome-headless-shell for
        # a different version than the locked one. The test then fails
        # with "Executable doesn't exist at .../chromium_headless_shell-<v>"
        # because the installed binary version doesn't match the one
        # playwright@locked-version expects.
        run: npm ci
      - name: Install Playwright Browsers
        # Now that deps are installed, this resolves to the locked
        # version's `playwright install` and downloads the matching
        # chromium build.
        run: npx playwright install chromium --with-deps
      - name: Symlink workspace deps for integration-tests build
        # `tsc` in integration-tests resolves modules with NodeNext
        # which walks node_modules up the directory tree. After the
        # workspace install, playwright lives at workspace-root
        # node_modules — symlink it into integration-tests so the
        # closest-resolution rule lands on the single hoisted copy
        # instead of attempting to resolve via citadel-workspaces.
        run: |
          mkdir -p citadel-workspaces/integration-tests/node_modules
          ln -sf ${{ github.workspace }}/node_modules/playwright \
                 citadel-workspaces/integration-tests/node_modules/playwright
          ln -sf ${{ github.workspace }}/node_modules/@playwright \
                 citadel-workspaces/integration-tests/node_modules/@playwright
      - name: Start Services
        env:
          INTERNAL_SERVICE_PORT: '12345'
          WORKSPACE_MASTER_PASSWORD: 'ci-test-password'
        run: docker compose up -d --build --wait
      - name: Dump Service Logs on Start Failure
        if: failure()
        run: |
          echo "=== sync-wasm-client logs ==="
          docker compose logs sync-wasm-client 2>&1 | tail -200
          echo "=== server logs ==="
          docker compose logs server 2>&1 | tail -50
          echo "=== internal-service logs ==="
          docker compose logs internal-service 2>&1 | tail -50
      - name: Clean Docker Build Cache
        run: |
          docker builder prune -af
          docker image prune -af
          df -h
      - name: Run Integration Test
        env:
          IN_CI: 'true'
          WORKSPACE_MASTER_PASSWORD: 'ci-test-password'
          # Several tests call `restartBackendServices` which spawns
          # `docker compose` from the test runner; without
          # INTERNAL_SERVICE_PORT in scope, the docker-compose.yml
          # `${INTERNAL_SERVICE_PORT:-12345}` fallback works but the
          # test runner's docker compose invocations would log a
          # warning. Match Start Services' value so the runner
          # inherits the same env.
          INTERNAL_SERVICE_PORT: '12345'
        run: npm run ${{ matrix.test }}
        working-directory: citadel-workspaces/integration-tests
      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.artifact }}
          path: citadel-workspaces/integration-tests/screenshots/

  playwright-tests:
    # The @playwright/test suite under integration-tests/src/tests-pw. It existed
    # but ran in NO job, so those specs were dead weight: written, compiled by the
    # typecheck job, and never executed against a running stack.
    #
    # Sharded rather than one job per spec (which is how the legacy suite is laid
    # out): the runner distributes specs across shards itself, so adding a spec
    # needs no matrix edit, and a slow spec no longer defines the critical path.
    name: Playwright - shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        # Root install first, for the same module-resolution reason documented on
        # the integration-tests job: two copies of playwright make tsc see two
        # distinct playwright-core type identities.
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
      - name: Symlink workspace deps for integration-tests
        run: |
          mkdir -p citadel-workspaces/integration-tests/node_modules
          ln -sf ${{ github.workspace }}/node_modules/playwright \
                 citadel-workspaces/integration-tests/node_modules/playwright
          ln -sf ${{ github.workspace }}/node_modules/@playwright \
                 citadel-workspaces/integration-tests/node_modules/@playwright
      - name: Start Services
        env:
          INTERNAL_SERVICE_PORT: '12345'
          WORKSPACE_MASTER_PASSWORD: 'ci-test-password'
        run: docker compose up -d --build --wait
      - name: Dump Service Logs on Start Failure
        if: failure()
        run: |
          docker compose logs sync-wasm-client 2>&1 | tail -200
          docker compose logs server 2>&1 | tail -50
          docker compose logs internal-service 2>&1 | tail -50
      - name: Clean Docker Build Cache
        run: |
          docker builder prune -af
          docker image prune -af
          df -h
      - name: Run Playwright Tests
        env:
          IN_CI: 'true'
          # No test.config.json in CI — it is gitignored, so lib/config.ts falls
          # through to this env var. It previously WAS committed, carrying a
          # different password than the one the server boots with, and
          # `externalConfig.workspacePassword ?? process.env...` meant the file
          # silently won.
          WORKSPACE_MASTER_PASSWORD: 'ci-test-password'
          INTERNAL_SERVICE_PORT: '12345'
        run: npx playwright test --shard=${{ matrix.shard }}/3
        working-directory: citadel-workspaces/integration-tests
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          # Includes the traces referenced by the HTML report; `trace:
          # on-first-retry` in playwright.config.ts means a flake that passes on
          # retry still leaves a trace of the failing attempt.
          path: |
            citadel-workspaces/integration-tests/playwright-report/
            citadel-workspaces/integration-tests/test-results/

  deploy-gate-tests:
    # Regression coverage for the release-consistency gate that stands between a `docker
    # compose pull` and a production restart. It is the mechanism that stops a partially
    # promoted `latest` from restarting production on two backend images that never shipped
    # together - so it must not be the one piece of the deploy path that nothing exercises.
    #
    # Runs against REAL images with real labels (cheap: a few `FROM busybox` layers), so it
    # tests `docker image inspect` behaviour rather than a mock of it - including the
    # `<no value>` string docker prints for an absent label, which is exactly the sort of
    # detail a stub would paper over.
    name: Deploy Gate - image revision check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fixture images
        run: |
          set -euo pipefail
          printf 'FROM busybox\nLABEL org.opencontainers.image.revision=aaaaaaaaaaaa\n' | docker build -q -t rev-a - >/dev/null
          printf 'FROM busybox\nLABEL org.opencontainers.image.revision=aaaaaaaaaaaa\n' | docker build -q -t rev-a-copy - >/dev/null
          printf 'FROM busybox\nLABEL org.opencontainers.image.revision=bbbbbbbbbbbb\n' | docker build -q -t rev-b - >/dev/null
          printf 'FROM busybox\n' | docker build -q -t rev-none - >/dev/null

      - name: Matching revisions are allowed through
        run: |
          set -euo pipefail
          ./scripts/verify-image-revisions.sh rev-a rev-a-copy
          echo "PASS: images from the same commit deploy."

      - name: MISMATCHED revisions abort the deploy
        run: |
          set -euo pipefail
          if ./scripts/verify-image-revisions.sh rev-a rev-b; then
            echo "::error::The gate allowed images from DIFFERENT commits through. A partial 'latest' promotion would restart production on a mismatched pair."
            exit 1
          fi
          echo "PASS: mismatched images are refused."

      - name: A SINGLE image is still inspected
        # A server-only deployment passes exactly ONE image, so this is a supported production
        # shape rather than a degenerate call - and it must still be inspected. "Nothing to
        # compare against" removes the cross-image check, not the provenance check.
        #
        # The failure direction is the load-bearing one. An `if [ "$#" -eq 1 ]; then exit 0`
        # fast path looks harmless and passes both success cases below, but it returns before
        # `docker image inspect` runs - so a server-only deploy whose pull silently failed, or
        # whose tag does not exist, would sail through the gate built to catch precisely that.
        # The end-to-end test cannot see this: its docker stub always inspects successfully.
        run: |
          set -euo pipefail
          ./scripts/verify-image-revisions.sh rev-a
          echo "PASS: a single labelled image deploys."
          ./scripts/verify-image-revisions.sh rev-none
          echo "PASS: a single unlabelled image warns but does not block."
          if ./scripts/verify-image-revisions.sh definitely-not-pulled:latest 2>/dev/null; then
            echo "::error::The gate allowed a single image it could not inspect. A server-only deploy whose pull never completed would restart production on a stale or missing image."
            exit 1
          fi
          echo "PASS: a single un-inspectable image is refused."

      - name: --expect refuses images built from a different commit
        # Cross-checking the images against each other proves they were promoted
        # TOGETHER, not which commit they are. `git pull` and `docker compose pull`
        # are independent, so on the ordinary merge-then-deploy workflow - where CI
        # is often still building the Rust images - `latest` still points at the
        # previous commit. All images agree, the gate passes, everything restarts,
        # and "Deploy complete!" prints over the old binaries.
        #
        # The failure case is the load-bearing one: a --expect that silently
        # ignores a mismatch is indistinguishable from not passing it at all.
        run: |
          set -euo pipefail
          ref_a=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' rev-a)
          ./scripts/verify-image-revisions.sh --expect "$ref_a" rev-a
          echo "PASS: images matching the expected commit deploy."
          ./scripts/verify-image-revisions.sh --expect "${ref_a:0:12}" rev-a
          echo "PASS: the short form of the same sha is accepted."
          if ./scripts/verify-image-revisions.sh --expect 0000000000000000000000000000000000000000 rev-a 2>/dev/null; then
            echo "::error::The gate accepted images built from a different commit than the one being deployed. A deploy run before CI finished publishing would ship the previous commit and report success."
            exit 1
          fi
          echo "PASS: a commit mismatch is refused."
          if ./scripts/verify-image-revisions.sh --expect 2>/dev/null; then
            echo "::error::--expect with no value was accepted."
            exit 1
          fi
          echo "PASS: --expect requires a value."

      - name: Deploy restart guards - run deploy.sh end to end
        # The selector test below proves the LIST is right. This proves deploy.sh ACTS on it:
        # it runs the real script against fixture compose files with a recording `docker` stub on
        # PATH, and asserts which services were pulled and restarted - and that an omitted service
        # is never touched. Without this, the headline fix (no unconditional `up -d --no-deps ui`)
        # has no coverage and could be reintroduced with every other test still green.
        #
        # This is not hypothetical: it immediately caught that a server-only deploy still aborted,
        # because the release gate rejected a single-image deployment as a usage error.
        run: ./scripts/test-deploy-services.sh

      - name: Deploy service selection covers every compose shape
        # This selection decides what is pulled, revision-checked AND restarted. Both error
        # directions are deployment-critical: too few silently skips a declared service while
        # still reporting success, too many runs `up -d` on an image that was never pulled.
        # docker-compose.production.yml documents that ui and internal-service are droppable,
        # so the slimmed shapes are supported configurations, not hypotheticals.
        run: |
          set -euo pipefail
          # PyYAML is declared rather than inherited from the runner image: a runner change would
          # otherwise turn this deterministic gate into an opaque ModuleNotFoundError.
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          # Fixtures are written into the CHECKOUT, not /tmp. `docker compose -f <file>` takes the
          # file's directory as the project directory, so a fixture in /tmp resolves `env_file:`
          # paths and ${VAR} references against /tmp instead of the repo root - the test could then
          # fail, or silently resolve a variable to empty, for reasons having nothing to do with
          # service selection, and it would not match how deploy.sh invokes the same command.
          trap 'rm -f fx-*.yml' EXIT

          # Build fixtures from the real production compose so this tracks the actual file.
          # Dangling depends_on entries must be stripped or compose rejects the project.
          python3 - <<'PYEOF'
          import yaml, pathlib
          base = yaml.safe_load(open('docker-compose.production.yml'))
          shapes = {'full':['server','internal-service','ui'], 'server-only':['server'],
                    'server-ui':['server','ui'], 'server-is':['server','internal-service'],
                    'no-server':['ui']}
          for name, keep in shapes.items():
              d = yaml.safe_load(yaml.safe_dump(base))
              for svc in list(d['services']):
                  if svc not in keep: d['services'].pop(svc)
              for svc, cfg in d['services'].items():
                  dep = cfg.get('depends_on')
                  if isinstance(dep, dict):
                      kept = {k: v for k, v in dep.items() if k in keep}
                      cfg['depends_on'] = kept
                      if not kept: cfg.pop('depends_on')
                  elif isinstance(dep, list):
                      kept = [x for x in dep if x in keep]
                      cfg['depends_on'] = kept
                      if not kept: cfg.pop('depends_on')
              pathlib.Path(f'fx-{name}.yml').write_text(yaml.safe_dump(d))
          PYEOF

          check() {  # <fixture> <expected space-separated services>
            local got
            got=$(./scripts/select-deploy-services.sh "fx-$1.yml" | tr '\n' ' ' | sed 's/ $//')
            if [ "$got" != "$2" ]; then
              echo "::error::selection for '$1' was [$got], expected [$2]. A wrong set here means a half-applied deploy."
              exit 1
            fi
            echo "  $1 -> $got"
          }
          check full        "server internal-service ui"
          check server-only "server"
          check server-ui   "server ui"
          check server-is   "server internal-service"

          # A compose file with no server must ABORT, not return an empty set - "nothing to
          # deploy" reported as a successful no-op deploy is the worst possible outcome.
          if ./scripts/select-deploy-services.sh fx-no-server.yml >/dev/null 2>&1; then
            echo "::error::a compose file with no 'server' service was accepted; it must abort."
            exit 1
          fi
          echo "  no-server -> correctly aborts"

          # An unreadable file must fail loudly rather than yield an empty selection.
          if ./scripts/select-deploy-services.sh fx-definitely-absent.yml >/dev/null 2>&1; then
            echo "::error::a missing compose file was accepted; it must abort."
            exit 1
          fi
          echo "  missing file -> correctly aborts"

          # DRIFT GUARD: every deployable service the production compose declares must appear in
          # the selection. The selector filters against a hardcoded DEPLOYABLE list, so a service
          # added to docker-compose.production.yml but not to that list would be silently dropped
          # from pull, revision-check and restart - the selector's own documented "too few ->
          # silently skipped while the run still reports success" failure, and the direction the
          # shape checks above cannot see.
          #
          # This runs against the REAL compose file, not fx-full.yml: the fixture builder keeps a
          # hardcoded ['server','internal-service','ui'], so it would strip a newly added service
          # before the assertion ever saw it and this guard would pass while the drift shipped.
          #
          # cloudflared is excluded deliberately - it is profile-gated and handled by deploy.sh's
          # TUNNEL_PROFILE_ACTIVE branch rather than by this selection.
          # Both sides are captured into variables rather than compared as `diff <(a) <(b)`.
          # Process substitution discards the child's exit status, so if `docker compose config`
          # failed, both sides would be EMPTY and diff would report no difference - a guard that
          # passes precisely when it cannot see anything. Assigning first means `set -e` aborts on
          # a failed read, and the emptiness check below makes a vacuous pass impossible.
          declared=$(docker compose -f docker-compose.production.yml config --services | grep -vx cloudflared | sort)
          selected=$(./scripts/select-deploy-services.sh docker-compose.production.yml | sort)
          if [ -z "$declared" ] || [ -z "$selected" ]; then
            echo "::error::could not read services from docker-compose.production.yml; the drift guard cannot run and must not pass silently."
            exit 1
          fi
          if [ "$declared" != "$selected" ]; then
            echo "::error::docker-compose.production.yml declares a deployable service the selector does not return. Add it to DEPLOYABLE in scripts/select-deploy-services.sh, or it will be silently skipped by pull, revision-check and restart."
            diff <(printf '%s\n' "$declared") <(printf '%s\n' "$selected") || true
            exit 1
          fi
          echo "  production compose -> no service missing from the selection"

      - name: THREE images are all checked, not just the first two
        # deploy.sh now passes three images (server, internal-service, ui). The script iterates
        # over "$@", so this works - but nothing pinned it, and the failure mode of a hardcoded
        # $1/$2 would be silent: the third image's revision simply never compared, so a UI built
        # from a different commit would deploy against mismatched backends and the gate would
        # report success. Assert both directions, with the odd one out LAST so a gate that only
        # looks at the first two arguments fails this test.
        run: |
          set -euo pipefail
          ./scripts/verify-image-revisions.sh rev-a rev-a-copy rev-a
          echo "PASS: three images from the same commit deploy."
          if ./scripts/verify-image-revisions.sh rev-a rev-a-copy rev-b; then
            echo "::error::The gate ignored the THIRD image. A UI built from a different commit than the backends would deploy unnoticed."
            exit 1
          fi
          echo "PASS: a mismatched third image is refused."

      - name: Unlabelled images warn but do not block
        # Locally-built and pre-label images carry no revision. Blocking them would strand
        # anyone deploying an older or locally built image, so the documented behaviour is to
        # warn and continue - pinned here so it cannot silently become a hard failure.
        run: |
          set -euo pipefail
          ./scripts/verify-image-revisions.sh rev-a rev-none
          ./scripts/verify-image-revisions.sh rev-none rev-none
          echo "PASS: unlabelled images fall back to a warning."

      - name: A MISSING image is refused, not treated as unlabelled
        # `docker image inspect` fails outright for an image that was never pulled. That must NOT
        # be conflated with "inspected fine, but carries no label" - an image we cannot see is an
        # image we cannot verify, so it has to fail the gate rather than slip through the
        # warn-and-continue path. Asserting the FAILURE here is the point: an earlier version of
        # this step passed whichever way the script behaved, which pinned the bypass instead of
        # catching it.
        run: |
          set -euo pipefail
          if ./scripts/verify-image-revisions.sh rev-a definitely-not-pulled:latest 2>/dev/null; then
            echo "::error::The gate ALLOWED an image it could not even inspect. A partially completed 'docker compose pull' would sail straight through the release-consistency check."
            exit 1
          fi
          echo "PASS: an un-inspectable image is refused."

      - name: deploy.sh parses
        run: bash -n deploy.sh && bash -n scripts/verify-image-revisions.sh

  production-build:
    name: Production Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free Disk Space
        run: |
          # Remove unnecessary pre-installed tools (frees 10-20 GB)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h
      # BEFORE the sync container runs, not after.
      #
      # The sync mounts named volumes over three node_modules directories. On a
      # fresh checkout those directories do not exist, so Docker CREATES each
      # mount point — as root — inside the bind-mounted source tree. A later
      # `npm ci` then cannot write into them: EACCES on mkdir .../@types.
      #
      # Running the install first means the directories already exist and are
      # owned by the runner; Docker mounts over them and the host ownership
      # underneath is untouched. This passed locally either way, because a
      # developer checkout already has node_modules — the difference only shows
      # on a clean one.
      - name: Set up Node for the production-bundle gates
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies for the gates
        run: npm ci
      - name: Create the sync's mount points before Docker does
        # Docker creates a missing bind/volume mount point itself, as ROOT,
        # inside the source tree. `npm ci` happens to create the node_modules
        # ones; nothing creates dist/, so the sync_ui_dist volume made the
        # daemon create a root-owned citadel-workspaces/dist — and the
        # production build could then not write its own service worker into it:
        #   EACCES: permission denied, open '.../dist/sw.js'
        #
        # Creating them here means they already exist and belong to the runner;
        # Docker mounts over them and the ownership underneath is untouched.
        # This cannot be reproduced on macOS, where the daemon does not recreate
        # missing mount points at all — which is why it took a CI run to see.
        run: |
          # EVERY volume-backed path in the sync service, not just the one that
          # failed. npm ci creates the workspace node_modules today, but npm
          # hoists — a workspace whose dependencies all hoist to the root gets no
          # local node_modules, and the daemon would then create that mount
          # point as root exactly as it did for dist/. Listing them all costs
          # nothing and closes the class rather than the instance.
          mkdir -p citadel-workspaces/dist
          mkdir -p citadel-workspaces/node_modules
          mkdir -p citadel-internal-service/typescript-client/node_modules
          mkdir -p citadel-workspace-client-ts/node_modules
      - name: Generate WASM artifacts (required for UI production build)
        # The UI production build embeds the wasm-pack generated
        # `citadel_internal_service_wasm_client.js` (and the matching
        # .wasm binary). Those artifacts are NOT git-tracked — they
        # land in citadel-internal-service/typescript-client/ via the
        # `sync-wasm-client` one-shot container that ships in
        # docker-compose.yml. Without it, the Vite production build
        # fails to resolve `../citadel_internal_service_wasm_client.js`
        # from `dist/InternalServiceWasmClient.js`.
        env:
          WORKSPACE_MASTER_PASSWORD: 'ci-prod-build'
          INTERNAL_SERVICE_PORT: '12345'
        run: docker compose up --build sync-wasm-client

      # The production-bundle gates live HERE, not in the typecheck matrix.
      #
      # They all begin with `vite build`, and that build embeds the wasm-pack
      # glue generated by the step above — an artefact that is not git-tracked.
      # In the typecheck job it does not exist, so every one of these steps
      # failed to resolve it, and the whole group had never once run in CI while
      # passing locally on any machine that had done a WASM build.
      #
      # This job already pays for the artefacts, and these gates measure the
      # PRODUCTION bundle, so this is also where they belong conceptually.
      - name: Landing bundle budget
        # Only the UI has a critical path to defend. "Lightning fast" is easy to
        # achieve once and lose gradually — one eager import in a shared provider
        # pulls a chunk onto the first paint and nobody notices, because nothing
        # was measuring.
        run: npm run build && npm run check:bundle
        working-directory: citadel-workspaces

      - name: PWA installability
        # The install button is drawn by the browser, not the app: if a manifest
        # field or an icon breaks, the button simply stops appearing. Nothing
        # errors and nothing logs, so only an explicit check notices.
        run: npm run check:pwa
        working-directory: citadel-workspaces

      - name: Source maps are usable
        # The deterministic half of Lighthouse's valid-source-maps. That audit
        # FETCHES each map, so on a loaded runner it reports "missing" against a
        # build whose maps are correct, and it has appeared in some runs here and
        # not others. This reads the files instead: every chunk names a map, the
        # map exists, and it carries sourcesContent — without which a production
        # stack trace still cannot be resolved back to source.
        run: npm run check:sourcemaps
        working-directory: citadel-workspaces

      - name: Lighthouse baselines
        # Accessibility and SEO are held at 100 because they are rule checks, not
        # measurements — they pass today, so anything less is a regression
        # somebody introduced. Performance has a deliberately loose floor: it IS
        # a measurement, a shared runner is slower and noisier than a laptop, and
        # a tight perf gate produces a flaky red build. A flaky gate is worse
        # than no gate, because people learn to re-run it without reading it.
        # Drift is caught precisely by the bundle budget above; this catches a
        # collapse. The actual scores print either way, so a downward trend is
        # visible before it trips.
        run: npm run check:lighthouse
        working-directory: citadel-workspaces

      - name: Install Chromium for the offline check
        # check:pwa is a static read of dist/ and needs no browser. Proving the
        # app actually LOADS offline needs a real service worker to register,
        # activate and serve a navigation from cache, which only a browser does.
        run: npx playwright install --with-deps chromium
        working-directory: citadel-workspaces

      - name: PWA offline behaviour
        # The app tells the user "will now load without a connection" once the
        # worker is ready. Nothing verified that promise until this step: a
        # precache that silently stopped covering the shell would leave an
        # installed app opening to a blank page with no connection, and every
        # other check would stay green.
        run: npm run check:pwa-offline
        working-directory: citadel-workspaces

      - name: PWA update flow
        # The upgrade half of the lifecycle, and the half that fails silently:
        # an installed worker keeps serving its cached bundle by design, so a
        # broken update path produces no error and no complaint — the app just
        # stops changing. The unit test beside PwaUpdatePrompt mocks the
        # register hook, proving the component reacts to needRefresh but never
        # that anything sets it.
        run: npm run check:pwa-update
        working-directory: citadel-workspaces

      - name: Reduced motion
        # Neither axe nor Lighthouse reports motion, so ninety of the app's
        # hundred animations opted out of prefers-reduced-motion unnoticed.
        # Also checks that suppressing motion did not suppress the dialogs the
        # motion was attached to — a failure only reduced-motion users would see.
        run: npm run check:reduced-motion
        working-directory: citadel-workspaces

      - name: Mobile layout
        # axe measures colour, names and roles — not size. Three controls
        # shipped under the WCAG 2.2 24px target floor, including the close
        # button on every dialog in the app, with every a11y gate green.
        run: npm run check:mobile
        working-directory: citadel-workspaces
      - name: Build Production Images (server + internal-service + ui)
        run: |
          # The UI image has its own multi-stage `production` target with a
          # templated nginx config, a non-root user setup, a security-header
          # block and the /ws proxy. None of that is exercised by the dev
          # `target: dev` build, so a broken template, a wrong
          # `COPY --from=build` path, or a missing `target: production` would
          # otherwise only surface during an actual production deploy.
          docker compose -f docker-compose.production.yml build server internal-service

          # The `ui` service is intentionally build-less in the production
          # compose file: production PULLS a published image, and carrying a
          # `build:` next to `image:` would make Compose build locally and
          # silently bypass the published artifact the release gate verified.
          #
          # That means Compose cannot build it for us here - `compose build ui`
          # prints "No services to build" and exits 0, so CI would sail past a
          # completely unbuilt image and only fail later, opaquely, when `up`
          # tried to PULL a tag that does not exist yet on a PR branch.
          #
          # So build it straight from the Dockerfile and tag it with the exact
          # reference the compose file resolves to. Compose's default
          # pull_policy is `missing`, so a locally-present tag is used as-is and
          # nothing is pulled. This also keeps CI honest: it validates the image
          # built from THIS commit's source, not whatever `latest` happens to be.
          docker build \
            -f docker/ui/Dockerfile \
            --target production \
            -t ghcr.io/avarok-cybersecurity/citadel-workspace-ui:latest \
            .
      - name: Verify Images Were Built
        run: |
          echo "Checking for built images..."
          docker images
          # Assert against the DAEMON, by the exact tag the compose file resolves
          # to. The previous check asked `docker compose images <svc>`, which
          # reports a row for a declared service whether or not the image was
          # ever built - so it returned non-empty for an image that did not
          # exist, and the "verification" passed while the build had silently
          # dropped the UI entirely. `docker image inspect` cannot do that.
          missing=0
          for img in \
            ghcr.io/avarok-cybersecurity/citadel-workspace-server:latest \
            ghcr.io/avarok-cybersecurity/citadel-workspace-internal-service:latest \
            ghcr.io/avarok-cybersecurity/citadel-workspace-ui:latest; do
            if docker image inspect "$img" >/dev/null 2>&1; then
              echo "  present: $img"
            else
              echo "  MISSING: $img"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "ERROR: at least one production image was not built (see MISSING above)."
            exit 1
          fi
          echo "Production images built successfully"
      - name: Smoke Test - /ws proxy security controls
        # The PR GATE for the agent proxy. These assertions used to live only in
        # publish-images.yml, which runs on master pushes - i.e. AFTER the merge decision.
        # A PR that regressed the fail-closed switch or the envsubst pinning would have gone
        # green here and only been caught at promotion time, or shipped if publish were
        # bypassed. The controls guard an unauthenticated control plane, so they have to be
        # asserted on the change that could break them.
        #
        # Shared with publish-images.yml so the two gates cannot drift into testing
        # different things.
        run: ./scripts/smoke-ui-ws.sh ghcr.io/avarok-cybersecurity/citadel-workspace-ui:latest 18080
      - name: Smoke Test - the production image in a real browser
        # The only check that drives a browser against the artefact users get.
        # Every Playwright spec runs on the Vite dev server, which sends no CSP
        # and no Permissions-Policy, so a feature can pass all 84 and be dead on
        # deploy. Calling did exactly that: production shipped
        # `Permissions-Policy: microphone=(), camera=()` and getUserMedia was
        # refused for the app's own origin.
        #
        # smoke-ui-ws.sh asserts the header TEXT; this asserts what the browser
        # DOES with it. A policy can be present, well-formed, and still not grant
        # what the app needs — and note that `getUserMedia` remains defined when
        # denied, so probing for the API is not enough.
        run: node scripts/check-production-image.mjs ghcr.io/avarok-cybersecurity/citadel-workspace-ui:latest 18085
      - name: Smoke Test - Services Start
        env:
          WORKSPACE_MASTER_PASSWORD: 'ci-smoke-test'
          INTERNAL_SERVICE_PORT: '12345'
        run: |
          # Start services and wait for health checks.
          #
          # Worst-case time to "healthy" is `start_period + retries *
          # interval` from each service's healthcheck definition. The
          # production compose currently uses 60s start_period + 5
          # retries * 15s interval = 135s ceiling, so this timeout has
          # to be larger than 135s with margin. Previously 120s, which
          # would race the healthcheck window and report flaky
          # failures even on healthy services.
          docker compose -f docker-compose.production.yml up -d server internal-service
          echo "Waiting for server to become healthy..."
          timeout 180 bash -c 'until docker compose -f docker-compose.production.yml ps server --format json | grep -qw healthy; do sleep 5; echo "Waiting..."; done' || {
            echo "Server failed to become healthy"
            docker compose -f docker-compose.production.yml logs server
            exit 1
          }
          echo "Server is healthy"
          echo "Waiting for internal-service to become healthy..."
          timeout 180 bash -c 'until docker compose -f docker-compose.production.yml ps internal-service --format json | grep -qw healthy; do sleep 5; echo "Waiting..."; done' || {
            echo "Internal-service failed to become healthy"
            docker compose -f docker-compose.production.yml logs internal-service
            exit 1
          }
          echo "Internal-service is healthy"
          # UI nginx smoke test. The production UI container has no
          # docker healthcheck of its own — it's a stateless nginx
          # serving static SPA assets — so we exercise it directly by
          # starting it and curling its bound port. A failure here
          # catches: the nginx config printf'd in the Dockerfile being
          # malformed, the `COPY --from=build /app/dist` path being
          # wrong, the non-root chown step landing on the wrong dirs,
          # or the CSP `connect-src` allow-list being missing for ws.
          docker compose -f docker-compose.production.yml up -d ui
          echo "Waiting for UI to start serving on port 8080 (host network)..."
          # The UI's nginx listens on 8080 and `docker-compose.production.yml`
          # uses `network_mode: host`, so curl localhost directly. Wait up
          # to 60s for the container to bind the port and serve the SPA.
          if ! timeout 60 bash -c 'until curl -fsS -o /dev/null http://localhost:8080/; do sleep 2; echo "Waiting..."; done'; then
            echo "UI failed to serve on port 8080"
            docker compose -f docker-compose.production.yml logs ui
            exit 1
          fi
          # Sanity: the served root must contain the SPA shell. A
          # successful 200 from a misconfigured root (e.g. nginx default
          # welcome page) would otherwise mask a Dockerfile regression.
          if ! curl -fsS http://localhost:8080/ | grep -q -i '<div id="root"'; then
            echo "UI served a 200 but the response does not look like the SPA shell"
            curl -fsS http://localhost:8080/ | head -40
            exit 1
          fi
          echo "UI is serving the SPA shell"
          echo "Smoke test passed: server, internal-service, ui all up"
      - name: Persistence - restarting the server must not duplicate the workspace tree
        # THE gap that let the structure-duplication bug ship. Every other test runs the server
        # on the IN-MEMORY backend, where each boot legitimately starts from an empty store - so
        # seeding-on-every-boot is indistinguishable from correct behaviour and no unit test can
        # see the bug. Only a real restart against a real filesystem backend exposes it, and
        # `docker-compose.production.yml` is the only place the server runs that way.
        #
        # The server container from the smoke test above is already running with
        # WORKSPACE_BACKEND=filesystem on the `server_data` volume. Restart it against that SAME
        # volume and assert it did not seed a second copy of the office/room tree.
        env:
          WORKSPACE_MASTER_PASSWORD: 'ci-smoke-test'
          INTERNAL_SERVICE_PORT: '12345'
        run: |
          set -euo pipefail
          compose="docker compose -f docker-compose.production.yml"

          # Guard against a vacuous pass: if the FIRST boot seeded nothing, "the restart created
          # nothing" would be trivially true and would prove nothing.
          seeded_on_first_boot=$($compose logs server 2>&1 | grep -c "Creating office node" || true)
          echo "First boot seeded ${seeded_on_first_boot} offices."
          if [ "$seeded_on_first_boot" -eq 0 ]; then
            echo "::error::The server seeded no offices at all, so this check would be vacuous."
            $compose logs server 2>&1 | tail -40
            exit 1
          fi

          # Only inspect logs emitted AFTER the restart. Comparing cumulative counts before/after
          # would couple the result to docker's log buffering and rotation: if the daemon dropped
          # early lines, the "after" count could come out LOWER and the check would misfire. A
          # `--since` window asks the precise question instead - "did this boot create any office
          # or room nodes?" - and the answer must be no.
          restart_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Restarting the server against the same data volume (window starts ${restart_at})..."
          $compose restart server
          timeout 180 bash -c 'until docker compose -f docker-compose.production.yml ps server --format json | grep -qw healthy; do sleep 5; done' || {
            echo "::error::Server did not come back healthy after restart"
            $compose logs server 2>&1 | tail -40
            exit 1
          }

          created_after_restart=$($compose logs server --since "$restart_at" 2>&1 | grep -cE "Creating (office|room) node" || true)
          echo "Nodes created by the restarted server: ${created_after_restart}"

          if [ "$created_after_restart" -ne 0 ]; then
            echo "::error::The restart re-seeded the workspace: it created ${created_after_restart} office/room nodes on top of the existing tree. On a persistent backend this grows an extra copy of the whole tree on EVERY deploy."
            $compose logs server --since "$restart_at" 2>&1 | grep -E "Creating (office|room) node" | head -20
            exit 1
          fi

          # Positive confirmation, not just an absence: the guard must actually have run and said
          # so. Without this, a server that failed to reach the seeding code at all would also
          # produce zero creations and pass.
          if ! $compose logs server --since "$restart_at" 2>&1 | grep -q "already seeded; skipping"; then
            echo "::error::The restarted server never reported skipping the seed. It may not have reached the guard at all - this check cannot confirm the behaviour."
            $compose logs server --since "$restart_at" 2>&1 | tail -30
            exit 1
          fi
          echo "PASS: the restart created no offices or rooms, and the seed-once guard fired."
      - name: Dump Logs on Failure
        if: failure()
        run: |
          echo "=== server logs ==="
          docker compose -f docker-compose.production.yml logs server 2>&1 | tail -100
          echo "=== internal-service logs ==="
          docker compose -f docker-compose.production.yml logs internal-service 2>&1 | tail -100
          echo "=== ui logs ==="
          docker compose -f docker-compose.production.yml logs ui 2>&1 | tail -100
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.production.yml down -v --remove-orphans 2>/dev/null || true

