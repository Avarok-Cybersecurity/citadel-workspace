# =============================================================================
# Publish container images to GHCR and to Docker Hub.
#
# WHY THIS EXISTS
#
# Deploys previously built images ON the production host (`deploy.sh` ran
# `docker compose build`). That is slow (a full Rust release build per deploy),
# it requires the source tree and a toolchain on the production box, it offers
# no rollback (the previous image is simply gone), and it makes every deploy
# hostage to that host's Docker build networking. Building here instead and
# having the host `docker compose pull` fixes all four at once.
#
# TAGGING AND THE `latest` CONTRACT
#
# Each image is published under an immutable `sha-<12-char-sha>` tag. That is
# what makes rollback possible: `IMAGE_TAG=sha-abc123456789 ./deploy.sh`
# redeploys an exact prior build. 12 characters rather than git's default 7:
# these tags are the rollback handle, and a 7-char prefix collision would make
# an operator's chosen tag silently ambiguous.
#
# `latest` is published by a SEPARATE `promote-latest` job, never by the build
# matrix, for two reasons:
#
#   1. `workflow_dispatch` can be run from ANY branch. If the matrix pushed
#      `latest` directly, a manual run from a feature branch would overwrite the
#      tag that production pulls by default with unmerged code. `promote-latest`
#      is gated on `refs/heads/master`.
#   2. The matrix builds the three images as independent jobs. If `latest` were
#      pushed per-job, a run where `server` succeeded and `internal-service`
#      failed would leave `latest` pointing at a MISMATCHED pair, and a deploy
#      using the default tag would pull two versions that never shipped
#      together. `promote-latest` needs the whole matrix to succeed, so `latest`
#      only ever advances as a complete set.
#
# TWO REGISTRIES, ONE BUILD
#
# Every image is published to BOTH `ghcr.io` and Docker Hub. The name mapping is
# mechanical - the repository NAME never changes, only the namespace in front of
# it, because Docker Hub permits exactly one namespace segment where GHCR
# permits a path:
#
#   ghcr.io/avarok-cybersecurity/citadel-workspace-server
#        -> docker.io/avarok/citadel-workspace-server
#   ghcr.io/avarok-cybersecurity/citadel-workspace-internal-service
#        -> docker.io/avarok/citadel-workspace-internal-service
#   ghcr.io/avarok-cybersecurity/citadel-workspace-ui
#        -> docker.io/avarok/citadel-workspace-ui
#
# Both destinations get the SAME tags (`sha-<12>`, and `latest` via the promote
# job) off ONE build: buildx `--load` accepts several tags and loads the same
# image under each name, so the Docker Hub reference is a second name for the
# exact bits the smoke test exercised, not a second build that could differ.
#
# A missing Docker Hub credential FAILS the run; it never skips the push. See
# "Require the Docker Hub credentials" below for why a soft-skip was rejected.
#
# ONE-TIME MANUAL SETUP
#
# GHCR packages are created PRIVATE and stay that way. Pulling them therefore
# needs `docker login ghcr.io` with a token carrying `read:packages` - a one-time
# step for anyone deploying or running the local client. (Public would remove that
# step, but these images are an internal artifact and there is no reason to publish
# the org's build output to the world for the sake of one login.)
#
# Docker Hub needs the org-wide secrets `DOCKERHUB_USERNAME` and
# `DOCKERHUB_TOKEN` (an access token, not the account password). The first push
# to `avarok/citadel-workspace-*` CREATES each repository at whatever default
# visibility the account is configured for; if they are to be public - which is
# the only reason to mirror to Docker Hub at all, since GHCR already serves the
# org - that has to be set once, per repository, in the Docker Hub UI. Nothing
# in this workflow can set it, and a private Docker Hub repository is not an
# error it can detect.
# =============================================================================
name: Publish Images

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Never cancel a publish mid-push: a half-pushed manifest is worse than a slow
# one, and unlike `validate.yml` these runs have side effects outside the runner.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # The Docker Hub half of the name mapping, defined ONCE and read by both jobs.
  #
  # A literal, deliberately NOT `${{ secrets.DOCKERHUB_USERNAME }}`, even though
  # the two hold the same string. GitHub redacts a secret's value everywhere it
  # appears in a log, so deriving the namespace from the secret would print every
  # image reference this workflow touches as `docker.io/***/citadel-workspace-ui`
  # - turning the one line an operator needs when a push fails into a redaction.
  # The namespace is public by construction (it is in the pull command in the
  # docs); the token is the secret.
  DOCKERHUB_NAMESPACE: avarok

jobs:
  # Nothing gated publication. `validate.yml` declares `workflow_call:` at its
  # top and a repo-wide grep for `uses:.*validate.yml` returned only that
  # declaration — so the entrypoint existed and was never wired. `publish` had
  # no `needs` at all, and `promote-latest` needs only `publish`.
  #
  # A master commit failing every integration test, every Rust test, clippy,
  # typecheck and lint therefore still built three images, pushed sha-<12>, and
  # promoted `latest` — which is the tag docker-compose.production.yml and
  # deploy.sh pull by default. The existing smoke test is a port-liveness probe;
  # it proves the container starts, not that the code works.
  validate:
    name: Validate before publishing
    # No `timeout-minutes` here, deliberately. It is not a permitted key on a
    # job that calls a reusable workflow, and GitHub rejects the file at
    # run-creation time: the run appears with ZERO jobs and a red X, so nothing
    # was published for four days while the failure read as a broken build.
    # validate.yml bounds each of its own jobs, which check-ci-job-timeouts.mjs
    # verifies directly.
    uses: ./.github/workflows/validate.yml

  publish:
    name: Publish ${{ matrix.image }}
    # Observed 8m; this bounds a hang, not performance.
    # Without it a stuck job holds a runner for GitHub's 360-minute default.
    timeout-minutes: 40
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: ./docker/workspace-server/Dockerfile
            # The server Dockerfile declares no build args. Passing an ARG a Dockerfile does not
            # declare is a silent no-op that Docker only warns about, so build args are scoped
            # per-image here rather than passed globally to both.
            build_args: ""

            # Smoke-test config. The server refuses to start without a master
            # password, and we exercise the filesystem backend because that is
            # what production runs.
            smoke_port: 12349
            # Bind to LOOPBACK, matching the production default. Nothing is published out of
            # the container anyway (the smoke run uses no `-p` and no host networking, so the
            # listener is confined to the container's own network namespace), and the probe
            # runs via `docker exec` inside that namespace - so loopback costs nothing. But
            # this repository has a self-hosted runner, and a container that binds 0.0.0.0 is
            # one `-p` or one `network_mode: host` away from putting a server with a known
            # password on someone's LAN. Default to the narrow thing.
            smoke_env: >-
              -e WORKSPACE_MASTER_PASSWORD=ci-smoke-test
              -e WORKSPACE_BACKEND=filesystem
              -e WORKSPACE_DATA_DIR=/data/server
              -e WORKSPACE_BIND_ADDR=127.0.0.1:12349
          - image: ui
            dockerfile: ./docker/ui/Dockerfile
            # nginx serves the SPA and proxies /ws to the agent. Nothing to configure at build
            # time: the socket URL is derived from window.location at runtime and the agent's
            # address is the AGENT_UPSTREAM env var, so ONE image serves every topology.
            # Deliberately NO VITE_WS_URL build-arg - setting it would bake an absolute URL back
            # in and re-break the thing this image exists to fix.
            build_args: ""
            needs_wasm: true
            smoke_port: 8080
            # Deliberately NO published port. The generic liveness probe below runs
            # `docker exec ... nc`, so it does not need one - and the shared /ws smoke script
            # binds 127.0.0.1:18080 for its own containers, which would collide. The proxy is
            # opted in (the image fails closed) so the probe exercises a realistic config; the
            # fail-closed default and every security control are asserted inside the script.
            smoke_env: "-e WS_PROXY_ENABLED=1"
          - image: internal-service
            dockerfile: ./docker/internal-service/Dockerfile
            # Only this Dockerfile declares INTERNAL_SERVICE_PORT (it is baked into the image's
            # ENV and expanded by its CMD at runtime).
            build_args: |
              INTERNAL_SERVICE_PORT=12345
            smoke_port: 12345
            # Loopback, for the same reason as the server above.
            smoke_env: >-
              -e INTERNAL_SERVICE_PORT=12345
              -e INTERNAL_SERVICE_BIND_HOST=127.0.0.1
              -e INTERNAL_SERVICE_ALLOWED_ORIGINS=http://localhost:5291

    steps:
      # FIRST, before the checkout and before ~8 minutes of build. A missing
      # credential discovered after the build wastes that three times over, once
      # per matrix leg.
      - name: Require the Docker Hub credentials
        # This FAILS the run. It does not skip the Docker Hub push and report
        # green, and the distinction matters more here than anywhere else in the
        # file: this workflow produces the artefact production pulls. A run that
        # published to one of its two registries and finished green would leave
        # Docker Hub frozen at whatever it last received, with `latest` there
        # pointing at an older release than `latest` on GHCR - and nothing would
        # say so until somebody pulled a tag that was never pushed. The two
        # registries would then diverge silently and indefinitely. A red run is
        # recoverable in one click; a green one that published half a release is
        # not even visible.
        #
        # A soft-skip for forks was considered and rejected. This workflow has no
        # `pull_request:` trigger, so an outside contributor cannot reach it at
        # all; the only way to run it without the organisation secrets is to push
        # to a fork's own `master`, which nothing in this release process does.
        # Guarding against that hypothetical would cost the guarantee above.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${DOCKERHUB_USERNAME:-}" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "${DOCKERHUB_TOKEN:-}" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Docker Hub credentials are missing:$missing"
            echo "  This workflow publishes to GHCR *and* Docker Hub, and fails rather than"
            echo "  publishing to one of them: a half-published release that reports success"
            echo "  is how the two registries drift apart without anyone noticing."
            echo "  Set both as organisation secrets under"
            echo "  Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Docker Hub credentials are present (values not printed)."

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Disk Space
        # The `builder` stage is ~5.6 GB (full Rust toolchain + target/). A stock
        # GitHub runner does not have room for it alongside the preinstalled
        # toolchains, and the failure mode is an opaque "no space left on device"
        # deep inside a cargo build. Same step validate.yml already uses.
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          # Best effort: this frees cache, it does not build anything. apt takes a
          # lock, and unattended-upgrades holds one for minutes after boot — the
          # failure that killed test:crud in this same workflow. A cleanup that
          # cannot run is not a reason to fail the build. Preventive: no run has
          # failed here, but the mechanism is one already proven live in this file.
          sudo apt-get clean || echo 'apt-get clean skipped (lock held)'
          df -h

      - name: Generate WASM artifacts (UI build needs them)
        # The UI bundle imports the wasm-pack output (`citadel_internal_service_wasm_client.js`
        # and its .wasm). Those are NOT git-tracked - they are produced into
        # citadel-internal-service/typescript-client by the `sync-wasm-client` one-shot container.
        # Without this the Vite production build fails to resolve the import. Same step
        # validate.yml's production-build already relies on.
        if: matrix.needs_wasm
        env:
          WORKSPACE_MASTER_PASSWORD: 'ci-prod-build'
          INTERNAL_SERVICE_PORT: '12345'
        run: docker compose up --build sync-wasm-client

      - uses: docker/setup-buildx-action@v3

      - name: Compute image references
        # Docker image references MUST be lowercase, but the org is spelled
        # `Avarok-Cybersecurity`. Passing ${{ github.repository_owner }} straight
        # into a tag produces `ghcr.io/Avarok-Cybersecurity/...`, which the daemon
        # rejects with "repository name must be lowercase".
        #
        # The Docker Hub reference differs from the GHCR one in the namespace and
        # nothing else - same repository name, same tag - so a `sha-` tag read off
        # one registry is the same release on the other, with no lookup table.
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/citadel-workspace-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=docker.io/${DOCKERHUB_NAMESPACE}/citadel-workspace-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "SHA_TAG=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # No `registry:` - the action's documented default is Docker Hub.
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build production image (load locally, do NOT push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # `production` is the slim runtime stage (~145 MB). Without an explicit
          # target, Docker builds the LAST stage - which is `dev`, deliberately, so
          # that docker-compose.yml (which pins no target) keeps working. Omitting
          # this line would publish the 5.6 GB toolchain image.
          target: production
          # Load into the local daemon instead of pushing, so the smoke test below
          # runs against the EXACT artifact that will be published. Pushing first
          # and testing afterwards would leave a broken image in the registry for
          # anyone who pulled in between.
          load: true
          push: false
          build-args: ${{ matrix.build_args }}
          # ONE build, TWO destinations. buildx `--load` accepts several tags and
          # loads the SAME image under each name, so the Docker Hub reference is a
          # second name for the exact bits the smoke test below exercises -- not a
          # second build that could differ from the one that was tested, and not a
          # second trip through the ~8-minute Rust compile.
          #
          # The smoke test and `verify-image-revisions.sh` therefore cover both
          # registries by construction: there is only one artefact to cover.
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA_TAG }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.SHA_TAG }}
          # Stamp the commit into the image itself. `latest` is a MUTABLE tag on
          # INDEPENDENT registry repositories -- now six of them, three images across
          # two registries -- and no registry offers an atomic multi-repository tag
          # update, let alone a cross-registry one. So a promotion that succeeds for
          # `server` and then fails for `internal-service` would leave `latest`
          # pointing at a mismatched pair. This label is what lets `deploy.sh` detect
          # that and refuse to deploy the mixed set, rather than silently restarting
          # production on two images that never shipped together. It is registry-
          # agnostic -- `verify-image-revisions.sh` inspects whatever was pulled --
          # so mirroring to Docker Hub widens the window without weakening the net.
          # The check is the safety net; the promote job is the happy path.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Smoke test the image before publishing
        # The runtime stages deliberately omit the toolchain, the source tree and
        # most OS packages. A missing shared library, a missing runtime asset
        # (kernel.toml / documents/), or a broken CMD would otherwise only surface
        # during an actual deploy. This starts the real image and probes it with
        # `nc -z` - the same check the compose healthchecks use - so a broken image
        # can never reach the registry.
        run: |
          set -euo pipefail
          name="smoke-${{ matrix.image }}"
          # Clean up on EVERY exit path, not just success. On a GitHub-hosted runner a leaked
          # container dies with the VM, but this repository also has a SELF-HOSTED runner, where
          # a container left behind by a failed run keeps its ports bound and poisons the next
          # run. (A five-month-old leaked compose stack squatting on :12345/:12349 is exactly
          # how the deployment host ended up blocked.)
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" ${{ matrix.smoke_env }} "$IMAGE:$SHA_TAG"

          ok=0
          for _ in $(seq 1 45); do
            state=$(docker inspect -f '{{.State.Status}}' "$name" 2>/dev/null || echo gone)
            if [ "$state" != "running" ]; then
              echo "Container is '$state' - it exited instead of serving."
              break
            fi
            if docker exec "$name" nc -z 127.0.0.1 ${{ matrix.smoke_port }} 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::${{ matrix.image }} production image failed its smoke test - not publishing."
            docker logs "$name" 2>&1 | tail -50 || true
            exit 1
          fi
          echo "${{ matrix.image }} is listening on ${{ matrix.smoke_port }}; image is good."

          # "The port is bound" is a weak signal for a static server - nginx binds even when it is
          # serving nothing, and says nothing at all about the /ws security controls.
          if [ "${{ matrix.image }}" = "ui" ]; then
            # Same assertions the PR gate runs (validate.yml), from one shared script - so the
            # release gate can never end up testing less than the pull-request gate did.
            ./scripts/smoke-ui-ws.sh "$IMAGE:$SHA_TAG" 18080
          fi

      - name: Push immutable SHA tag to both registries
        # Only the immutable tag is pushed here. `latest` is advanced by the
        # `promote-latest` job below, and only when the whole matrix succeeded on
        # master - see the header comment.
        #
        # Both references name the SAME local image, so this uploads one artefact
        # to each registry; nothing is rebuilt between the two pushes.
        #
        # `set -e` is what makes the Docker Hub push non-optional. A Docker Hub
        # outage fails this leg, which fails `promote-latest`, so NEITHER
        # registry's `latest` advances on a release that did not fully publish --
        # the same all-or-nothing rule the job already had, extended to cover the
        # second registry. A `|| true` here would be the silent half-publish this
        # workflow must never report as success.
        #
        # GHCR first, deliberately. If Docker Hub fails, GHCR holds a `sha-` tag
        # that Docker Hub lacks; `sha-` tags are immutable and additive, so a
        # re-run pushes the missing one and converges. The reverse order would
        # leave the same state with no ordering benefit.
        run: |
          set -euo pipefail
          docker push "$IMAGE:$SHA_TAG"
          docker push "$DOCKERHUB_IMAGE:$SHA_TAG"

  promote-latest:
    name: Promote latest
    # Observed under a minute; this bounds a hang, not performance.
    # Without it a stuck job holds a runner for GitHub's 360-minute default.
    timeout-minutes: 15
    # `needs` requires EVERY matrix job to have succeeded. Combined with the
    # master-only guard, this is what guarantees `latest` never points at a
    # half-published release or at unmerged code from a manual branch dispatch.
    needs: publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # Checked again here, and first. This job runs on a fresh runner, so the
      # publish job's check proves nothing about this one - and a credential
      # revoked between the two would otherwise surface as a half-promoted
      # `latest`: advanced on GHCR, stale on Docker Hub. That is precisely the
      # mismatched state the `promote-latest` job exists to make impossible.
      - name: Require the Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${DOCKERHUB_USERNAME:-}" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "${DOCKERHUB_TOKEN:-}" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Docker Hub credentials are missing:$missing"
            echo '  The `latest` tag is promoted on BOTH registries or on neither. This'
            echo '  fails rather than advancing GHCR alone, which would leave the two'
            echo "  registries' default tag pointing at different releases."
            exit 1
          fi
          echo "Docker Hub credentials are present (values not printed)."

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # No `registry:` - the action's documented default is Docker Hub.
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Point latest at this release
        # `imagetools create` retags in the registry by manifest reference - it
        # does not pull or rebuild the image, so the bits under `latest` are
        # byte-identical to the SHA tag that just passed its smoke test.
        #
        # Source and target are in the SAME registry on both passes, so each is a
        # registry-side manifest copy. Promoting the Docker Hub tag from its own
        # `sha-` tag (rather than cross-registry from GHCR) keeps it that way and
        # keeps the two registries' `latest` derived from a tag already verified
        # present in the registry it is being promoted within.
        #
        # This job still runs only after EVERY matrix leg succeeded and only on
        # master, so `latest` on either registry advances only for a release where
        # all three images built, smoked, and reached both registries.
        #
        # REGISTRY IS THE OUTER LOOP, AND GHCR GOES FIRST. This is the whole
        # reason the loop is nested this way round rather than image-outer, and
        # it is not cosmetic.
        #
        # Promotion is not atomic across repositories (see the label comment in
        # the build step). Image-outer would interleave the two registries, so a
        # Docker Hub failure on the FIRST image would abort with GHCR's `latest`
        # advanced for `server` and stale for the other two -- a mismatched set
        # in the registry production actually pulls from. Adding a mirror would
        # then have made GHCR's promotion *less* reliable than before, which is a
        # guarantee this change must not spend.
        #
        # Registry-outer confines the blast radius to the registry that failed:
        # GHCR is either fully promoted before Docker Hub is touched at all, or
        # GHCR failed on its own and Docker Hub was never reached. A Docker Hub
        # outage therefore leaves Docker Hub wholly stale (consistent, just
        # behind) and GHCR wholly current, and the run is RED so somebody
        # re-runs it. `verify-image-revisions.sh` remains the net for a failure
        # partway through a single registry's pass, exactly as it was before.
        run: |
          set -euo pipefail
          sha_tag="sha-${GITHUB_SHA:0:12}"
          for prefix in \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" \
            "docker.io/${DOCKERHUB_NAMESPACE}"; do
            for img in server internal-service ui; do
              image="${prefix}/citadel-workspace-${img}"
              echo "Promoting ${image}:${sha_tag} -> ${image}:latest"
              docker buildx imagetools create -t "${image}:latest" "${image}:${sha_tag}"
            done
          done
          echo "Rollback handle for this release: IMAGE_TAG=${sha_tag}"
