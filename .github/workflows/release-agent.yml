# Builds and publishes the Citadel agent (the local internal service) so a user
# whose browser cannot reach it can download and run one.
#
# The UI links straight at
#   /releases/latest/download/<asset>
# which GitHub resolves to the newest published release. That is deliberate: no
# API call, no token, no rate limit, and nothing to break when the release list
# changes. It does mean the ASSET NAMES here are a contract with the UI —
# citadel-workspaces/src/lib/agent-download.ts holds the same list, and a test
# there reads this file and fails if the two drift apart.
name: Release agent

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. agent-v0.1.0). Dry run if the tag does not exist.'
        required: false

permissions:
  contents: write

jobs:
  build:
    # Bounds a hang, not performance. Without it a stuck job holds a runner for
    # GitHub's 360-minute default, and the observed worst case is the Windows
    # target at about 16 minutes.
    timeout-minutes: 45
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Platform TOKENS, not Rust target triples. The UI maps
          # navigator.userAgentData/platform onto these, and "macos-arm64" is
          # something a human can also pick off a release page correctly;
          # "aarch64-apple-darwin" is not.
          - os: macos-14
            target: aarch64-apple-darwin
            asset: citadel-agent-macos-arm64.tar.gz
          # Intel Mac is CROSS-COMPILED from the Apple Silicon runner, not built
          # on macos-13. Across three runs here, no runner was EVER assigned to
          # that label (`runner=` stayed empty for 45+ minutes) while macos-14
          # siblings were assigned within seconds. Retirement of the macOS 13
          # image is the likely explanation, but the established fact is the
          # unassigned runner — and either way a job whose label cannot be
          # satisfied does not fail, it queues.
          # In the first tagged release (run 32884394417) this leg sat queued
          # while the other three finished, and since `publish` needs all four,
          # the release could never have been cut.
          #
          # Apple's toolchain targets x86_64 from arm64 natively, so this needs
          # only `rustup target add`. Verified locally: a full
          # `cargo build --release --target x86_64-apple-darwin --features
          # vendored` produces a Mach-O x86_64 binary, and smoke-agent.sh's
          # architecture assertion checks the result matches the asset name.
          #
          # Caveat worth knowing: the smoke test runs this binary on an arm64
          # runner, so it executes under Rosetta. That proves the binary runs and
          # binds a port; it does not prove it runs on real Intel silicon, which
          # nothing in this matrix can prove now that no Intel runner exists.
          - os: macos-14
            target: x86_64-apple-darwin
            asset: citadel-agent-macos-x64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: citadel-agent-linux-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: citadel-agent-windows-x64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        run: rustup target add ${{ matrix.target }}

      # --features vendored builds OpenSSL from source instead of linking the
      # host's. Required on Windows, where openssl-sys finds no installation on
      # the MSVC runner and the build dies in a `-sys` crate (observed: run
      # 32880378921). Applied on every platform deliberately: this artifact is
      # DOWNLOADED and run on someone else's machine, so linking against
      # whatever OpenSSL the build agent happened to have is a runtime failure
      # waiting to happen on a machine that has a different one, or none.
      - name: Build the agent
        run: cargo build --release --target ${{ matrix.target }} -p citadel_service_bin --bin internal-service --features vendored
        working-directory: citadel-internal-service

      # Packaged with the run instructions beside the binary. `--bind` has no
      # default in the agent's CLI, so a downloaded binary run bare exits with a
      # structopt usage error; and the default account backend is in-memory, so
      # anyone who omits --backend loses their account on restart and reports it
      # as a bug.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp citadel-internal-service/target/${{ matrix.target }}/release/internal-service "$staging/citadel-agent"
          cp docs/AGENT_README.md "$staging/README.md"
          tar -czf "${{ matrix.asset }}" -C "$staging" .
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp citadel-internal-service/target/${{ matrix.target }}/release/internal-service.exe "$staging/citadel-agent.exe"
          cp docs/AGENT_README.md "$staging/README.md"
          (cd "$staging" && 7z a -tzip "$OLDPWD/${{ matrix.asset }}" .)
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      # Windows was excluded here while the smoke test only understood tar.gz,
      # which meant the Windows archive shipped WITHOUT the one check that
      # proves a downloaded agent runs — on the platform where "it built" and
      # "it runs" are least likely to coincide.
      - name: Smoke-test the packaged binary
        shell: bash
        run: ./scripts/smoke-agent.sh "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    # Observed under a minute; this bounds a hang, not performance.
    timeout-minutes: 15
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only a real tag push publishes. workflow_dispatch builds and smoke-tests
    # every platform without creating a release, so the pipeline is exercisable
    # without minting a version.
    if: startsWith(github.ref, 'refs/tags/agent-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Citadel agent ${GITHUB_REF_NAME#agent-}" \
            --notes "The local agent that Citadel Workspace connects to. Download the build for your platform, unpack it, and run it as described in the bundled README."
