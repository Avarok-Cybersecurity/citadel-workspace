# Builds and publishes the Citadel agent (the local internal service) so a user
# whose browser cannot reach it can download and run one.
#
# The UI links straight at
#   /releases/latest/download/<asset>
# which GitHub resolves to the newest published release. That is deliberate: no
# API call, no token, no rate limit, and nothing to break when the release list
# changes. It does mean the ASSET NAMES here are a contract with the UI —
# citadel-workspaces/src/lib/agent-download.ts holds the same list, and a test
# there reads this file and fails if the two drift apart.
name: Release agent

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. agent-v0.1.0). Dry run if the tag does not exist.'
        required: false

permissions:
  contents: write

jobs:
  build:
    # Bounds a hang, not performance. Without it a stuck job holds a runner for
    # GitHub's 360-minute default, and the observed worst case is the Windows
    # target at about 16 minutes.
    timeout-minutes: 45
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Platform TOKENS, not Rust target triples. The UI maps
          # navigator.userAgentData/platform onto these, and "macos-arm64" is
          # something a human can also pick off a release page correctly;
          # "aarch64-apple-darwin" is not.
          - os: macos-14
            target: aarch64-apple-darwin
            asset: citadel-agent-macos-arm64.tar.gz
          # Intel Mac is CROSS-COMPILED from the Apple Silicon runner, not built
          # on macos-13. Across three runs here, no runner was EVER assigned to
          # that label (`runner=` stayed empty for 45+ minutes) while macos-14
          # siblings were assigned within seconds. Retirement of the macOS 13
          # image is the likely explanation, but the established fact is the
          # unassigned runner — and either way a job whose label cannot be
          # satisfied does not fail, it queues.
          # In the first tagged release (run 32884394417) this leg sat queued
          # while the other three finished, and since `publish` needs all four,
          # the release could never have been cut.
          #
          # Apple's toolchain targets x86_64 from arm64 natively, so this needs
          # only `rustup target add`. Verified locally: a full
          # `cargo build --release --target x86_64-apple-darwin --features
          # vendored` produces a Mach-O x86_64 binary, and smoke-agent.sh's
          # architecture assertion checks the result matches the asset name.
          #
          # Caveat worth knowing: the smoke test runs this binary on an arm64
          # runner, so it executes under Rosetta. That proves the binary runs and
          # binds a port; it does not prove it runs on real Intel silicon, which
          # nothing in this matrix can prove now that no Intel runner exists.
          - os: macos-14
            target: x86_64-apple-darwin
            asset: citadel-agent-macos-x64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: citadel-agent-linux-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: citadel-agent-windows-x64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        run: rustup target add ${{ matrix.target }}

      # --features vendored builds OpenSSL from source instead of linking the
      # host's. Required on Windows, where openssl-sys finds no installation on
      # the MSVC runner and the build dies in a `-sys` crate (observed: run
      # 32880378921). Applied on every platform deliberately: this artifact is
      # DOWNLOADED and run on someone else's machine, so linking against
      # whatever OpenSSL the build agent happened to have is a runtime failure
      # waiting to happen on a machine that has a different one, or none.
      # THE BINARY THE BROWSER CAN TALK TO. citadel-workspace-internal-service (this repo)
      # wraps the kernel in the WebSocket interface and the Origin allowlist; it is what the
      # docker image runs. The submodule's citadel_service_bin starts the kernel on the raw
      # TCP interface -- a browser cannot open that -- and agent-v0.1.0 shipped it: the
      # binary bound its port, passed every smoke check, and closed the connection on the
      # first WebSocket handshake. smoke-agent.sh now performs that handshake.
      - name: Build the agent
        run: cargo build --release --target ${{ matrix.target }} -p citadel-workspace-internal-service --bin citadel-workspace-internal-service --features vendored

      # Signed and notarised BEFORE packaging, so the tarball carries a binary
      # macOS will run without argument.
      #
      # The binary Rust produces is "linker-signed" (ad-hoc): `spctl -a -t exec`
      # rejects it, so a Finder double-click is refused with "the developer
      # cannot be verified". Terminal execution of a quarantined ad-hoc binary
      # happens to still work today, which is why the download instructions on
      # the page work at all -- but that is Apple's tolerance, not a guarantee,
      # and it has been narrowing for several releases.
      #
      # The identity is READ FROM THE CERTIFICATE rather than carried in a
      # secret. A hand-typed "Developer ID Application: Name (TEAM)" is a second
      # copy of something the .p12 already states, and the failure when it drifts
      # is `codesign: no identity found`, which names neither copy.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64:-}" ] || [ -z "${CERT_PASSWORD:-}" ]; then
            echo "::error::MACOS_CERT_P12_BASE64 and MACOS_CERT_PASSWORD must both be set."
            echo "  A release must not ship an unsigned macOS binary, so this fails rather"
            echo "  than falling back to the ad-hoc signature Rust's linker produces."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kcpass" "$keychain"
          printf '%s' "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a GUI prompt no runner can answer.
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpass" "$keychain" >/dev/null 2>&1
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::the .p12 contains no 'Developer ID Application' identity."
            echo "  A 'Mac App Distribution' or 'Apple Development' certificate cannot sign"
            echo "  software distributed outside the App Store. Export the Developer ID one."
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing identity: $identity"

      - name: Sign and notarise
        if: runner.os == 'macOS'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/citadel-workspace-internal-service"

          # --options runtime is NOT optional: notarisation rejects anything
          # without the hardened runtime, and the rejection names the flag only
          # in the JSON log, not in the summary line.
          codesign --force --options runtime --timestamp \
            --sign "$SIGN_IDENTITY" "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          if [ -z "${NOTARY_KEY_P8_BASE64:-}" ] || [ -z "${NOTARY_KEY_ID:-}" ] || [ -z "${NOTARY_ISSUER_ID:-}" ]; then
            echo "::error::MACOS_NOTARY_KEY_P8_BASE64, MACOS_NOTARY_KEY_ID and MACOS_NOTARY_ISSUER_ID must be set."
            echo "  Signed but un-notarised is still refused by Gatekeeper, so shipping it"
            echo "  would look fixed and behave the same. Failing instead."
            exit 1
          fi

          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          # notarytool takes .zip, .pkg or .dmg -- never a bare binary or a
          # .tar.gz -- so the artefact is zipped purely for submission. The
          # ticket is issued against the signature, so the tarball built from
          # this binary afterwards carries a notarised one.
          ditto -c -k "$bin" "$RUNNER_TEMP/notarize.zip"
          set +e
          out="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m 2>&1)"
          rc=$?
          set -e
          rm -f "$RUNNER_TEMP/notary.p8"
          echo "$out"
          if [ "$rc" -ne 0 ] || ! echo "$out" | grep -q "status: Accepted"; then
            id="$(echo "$out" | awk '/id:/ {print $2; exit}')"
            echo "::error::notarisation did not return Accepted."
            echo "  Fetch the reasons with:"
            echo "    xcrun notarytool log $id --key-id <id> --issuer <issuer> --key <p8>"
            exit 1
          fi

          # A ticket CANNOT be stapled to a bare executable -- stapler handles
          # .app/.pkg/.dmg only -- so Gatekeeper validates online on first run.
          # That is acceptable here specifically: the agent exists to reach a
          # workspace server, so it is useless without a network anyway.
          echo "Notarised. Gatekeeper assessment (online check):"
          spctl -a -t exec -vv "$bin" || echo "  (spctl assessment is informational; the ticket may take a moment to propagate)"

      # Packaged with the run instructions beside the binary. `--bind` has no
      # default in the agent's CLI, so a downloaded binary run bare exits with a
      # structopt usage error; and the default account backend is in-memory, so
      # anyone who omits --backend loses their account on restart and reports it
      # as a bug.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp target/${{ matrix.target }}/release/citadel-workspace-internal-service "$staging/citadel-agent"
          cp docs/AGENT_README.md "$staging/README.md"
          tar -czf "${{ matrix.asset }}" -C "$staging" .
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp target/${{ matrix.target }}/release/citadel-workspace-internal-service.exe "$staging/citadel-agent.exe"
          cp docs/AGENT_README.md "$staging/README.md"
          (cd "$staging" && 7z a -tzip "$OLDPWD/${{ matrix.asset }}" .)
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      # Windows was excluded here while the smoke test only understood tar.gz,
      # which meant the Windows archive shipped WITHOUT the one check that
      # proves a downloaded agent runs — on the platform where "it built" and
      # "it runs" are least likely to coincide.
      - name: Smoke-test the packaged binary
        shell: bash
        run: ./scripts/smoke-agent.sh "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    # Observed under a minute; this bounds a hang, not performance.
    timeout-minutes: 15
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only a real tag push publishes. workflow_dispatch builds and smoke-tests
    # every platform without creating a release, so the pipeline is exercisable
    # without minting a version.
    if: startsWith(github.ref, 'refs/tags/agent-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Citadel agent ${GITHUB_REF_NAME#agent-}" \
            --notes "The local agent that Citadel Workspace connects to. Download the build for your platform, unpack it, and run it as described in the bundled README."
