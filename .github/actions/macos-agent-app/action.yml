# The app half of release-agent.yml's macos-app job: one universal Citadel Agent.app, from both
# macOS legs' signed binaries, notarised and stapled at $RUNNER_TEMP/app. The job images it.
name: Citadel Agent.app
description: Builds, signs, notarises and staples the universal macOS agent app.
inputs:
  version:
    description: The version the app is built as (the version job's output).
    required: true
  cert-p12-base64:
    description: MACOS_CERT_P12_BASE64.
    required: true
  cert-password:
    description: MACOS_CERT_PASSWORD.
    required: true
  notary-key-p8-base64:
    description: MACOS_NOTARY_KEY_P8_BASE64.
    required: true
  notary-key-id:
    description: MACOS_NOTARY_KEY_ID.
    required: true
  notary-issuer-id:
    description: MACOS_NOTARY_ISSUER_ID.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: bin-*
        path: bins
    - name: Import the signing certificate
      env:
        CERT_P12_BASE64: ${{ inputs.cert-p12-base64 }}
        CERT_PASSWORD: ${{ inputs.cert-password }}
      shell: bash
      run: ./scripts/import-macos-signing-cert.sh
    # Pinned: the window layout is this tool's output, and an unpinned upgrade
    # would change what ships without a change here.
    - name: Install dmgbuild
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install --quiet dmgbuild==1.6.7
        echo "DMGBUILD=$RUNNER_TEMP/venv/bin/dmgbuild" >> "$GITHUB_ENV"
    - name: Build the app
      shell: bash
      env:
        AGENT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        chmod +x bins/*/citadel-workspace-internal-service
        ./scripts/build-macos-agent-app.sh \
          bins/bin-aarch64-apple-darwin/citadel-workspace-internal-service \
          bins/bin-x86_64-apple-darwin/citadel-workspace-internal-service \
          "$AGENT_VERSION" "$RUNNER_TEMP/app"
    - name: Notarise and staple the app
      env:
        NOTARY_KEY_P8_BASE64: ${{ inputs.notary-key-p8-base64 }}
        NOTARY_KEY_ID: ${{ inputs.notary-key-id }}
        NOTARY_ISSUER_ID: ${{ inputs.notary-issuer-id }}
      shell: bash
      run: ./scripts/notarise-macos.sh "$RUNNER_TEMP/app/Citadel Agent.app"
