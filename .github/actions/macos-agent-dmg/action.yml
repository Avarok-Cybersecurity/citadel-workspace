# The image half of release-agent.yml's macos-app job, once it has packaged Citadel-Agent.dmg:
# notarise and staple the image, checksum the stapled file, and smoke-test it as a user runs it.
name: Citadel-Agent.dmg
description: Notarises, staples, checksums and smoke-tests the macOS disk image.
inputs:
  version:
    description: The version the image's app and agent must carry (the version job's output).
    required: true
  notary-key-p8-base64:
    description: MACOS_NOTARY_KEY_P8_BASE64.
    required: true
  notary-key-id:
    description: MACOS_NOTARY_KEY_ID.
    required: true
  notary-issuer-id:
    description: MACOS_NOTARY_ISSUER_ID.
    required: true
runs:
  using: composite
  steps:
    - name: Notarise and staple the disk image
      env:
        NOTARY_KEY_P8_BASE64: ${{ inputs.notary-key-p8-base64 }}
        NOTARY_KEY_ID: ${{ inputs.notary-key-id }}
        NOTARY_ISSUER_ID: ${{ inputs.notary-issuer-id }}
      shell: bash
      run: |
        set -euo pipefail
        ./scripts/notarise-macos.sh Citadel-Agent.dmg
        # After stapling: the ticket changes the file, so this is the published file's sum.
        shasum -a 256 Citadel-Agent.dmg > Citadel-Agent.dmg.sha256
    - name: Smoke-test the disk image
      shell: bash
      env:
        EXPECTED_VERSION: ${{ inputs.version }}
      run: ./scripts/smoke-agent.sh Citadel-Agent.dmg
    - name: Smoke-test the app as a user runs it
      shell: bash
      env:
        EXPECTED_VERSION: ${{ inputs.version }}
      run: ./scripts/smoke-macos-app.sh Citadel-Agent.dmg
