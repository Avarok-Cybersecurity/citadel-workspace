# The certificate job of release-agent.yml: the certificate for local.avarok.net that every build
# leg compiles in (include_bytes!), verified and handed to them as the agent-tls artifact.
#
# ISSUING IS A FALLBACK, NOT A DEFAULT. Let's Encrypt issues at most five certificates a week for
# one exact name, and this action used to issue on every real release: in the week before
# 2026-11-22 deploy runs 44018601504, 44000280048, 44404950812, 44543719941, 44939018558,
# 44958340345, 44968283960 and 45018182270 each spent one -- several were re-runs of releases
# that had failed for unrelated reasons -- plus renew-agent-tls run 43869130576, and deploy run
# 45073729582 was refused ("too many certificates (5) already issued") with nothing published.
# Every one of those was a 90-day certificate, thrown away with its runner.
#
# So scripts/agent-certificate-decision.mjs decides (the rule is lib/certificate-issuance.mjs):
#   use-committed  the committed certificate has floor + margin days (30 + 15 for a published
#                  build): every release while renew-agent-tls.yml keeps it fresh
#   use-cached     a certificate an earlier release issued in place of THIS committed one still
#                  has floor + margin: a re-run, or the next release, reuses it from the cache
#   issue          neither has: the renewal fell behind; issue ONE and cache it, keyed on the
#                  committed certificate's hash, so later runs reuse it until the renewal lands
#   refuse         a dry run whose committed certificate misses its floor; a dry run never issues
# Worst case from releases: one issuance per committed certificate per 45 days (an issued one
# serves 90 - 45 days), plus one if the cache entry is evicted (7 days unused). The weekly
# budget across both workflows is in renew-agent-tls.yml.
# Per release rather than per leg: five legs would be five duplicate certificates.
name: Agent certificate
description: Chooses (committed, cached, or -- as a fallback -- freshly issued) and verifies the certificate compiled into every agent build.
inputs:
  cloudflare-dns-api-token:
    description: CLOUDFLARE_DNS_API_TOKEN (Zone:DNS:Edit on avarok.net); read only when issuing.
    required: true
  real-release:
    description: "'true' for a real release (may reuse or, as a fallback, issue); 'false' for a dry run, which only ever uses the committed one."
    required: true
  margin-days:
    description: >-
      Days above floor-days the committed certificate must have before a real release uses it
      without issuing: release-agent.yml's CERT_REISSUE_MARGIN_DAYS. No default.
    required: true
  floor-days:
    description: >-
      Days the certificate must still be valid: 30 for a build that will be published (the floor
      smoke-agent.sh holds the packaged binary to), 0 ("valid now") for a dry run. An expired
      certificate fails at every floor. A dry run (run 44941697947) failed the 30-day floor a month
      before the committed certificate expired.
    required: true
runs:
  using: composite
  steps:
    # Keyed on the COMMITTED certificate: a cached one stands in for that one only, so once a
    # renewal lands the key changes and the fresh committed certificate is used again. Only
    # master and tag runs read these: a pull request's caches are scoped to the pull request.
    - name: Restore a certificate an earlier release issued in place of the committed one
      id: cached
      if: inputs.real-release == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/agent-tls-issued
        key: agent-tls-issued-${{ hashFiles('citadel-workspace-internal-service/tls/local.avarok.net.crt.pem') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: agent-tls-issued-${{ hashFiles('citadel-workspace-internal-service/tls/local.avarok.net.crt.pem') }}-
    - name: Use the committed certificate, reuse a cached one, or issue
      id: decide
      shell: bash
      env:
        REAL_RELEASE: ${{ inputs.real-release }}
        FLOOR_DAYS: ${{ inputs.floor-days }}
        MARGIN_DAYS: ${{ inputs.margin-days }}
        CACHED_DIR: ${{ runner.temp }}/agent-tls-issued
      run: |
        set -euo pipefail
        cached=none
        [ -f "$CACHED_DIR/local.avarok.net.crt.pem" ] && cached="$CACHED_DIR/local.avarok.net.crt.pem"
        node scripts/agent-certificate-decision.mjs release --real-release "$REAL_RELEASE" \
          --floor-days "$FLOOR_DAYS" --margin-days "$MARGIN_DAYS" --cached "$cached"
    - name: Build with the cached certificate
      if: steps.decide.outputs.action == 'use-cached'
      shell: bash
      env:
        CACHED_DIR: ${{ runner.temp }}/agent-tls-issued
      run: cp "$CACHED_DIR/local.avarok.net.crt.pem" "$CACHED_DIR/local.avarok.net.key.pem" citadel-workspace-internal-service/tls/
    - name: Obtain a certificate for local.avarok.net (DNS-01)
      if: steps.decide.outputs.action == 'issue'
      env:
        CF_TOKEN: ${{ inputs.cloudflare-dns-api-token }}
        CACHED_DIR: ${{ runner.temp }}/agent-tls-issued
      shell: bash
      run: |
        set -euo pipefail
        [ -n "${CF_TOKEN:-}" ] || { echo "::error::CLOUDFLARE_DNS_API_TOKEN is not set (needs Zone:DNS:Edit on avarok.net)."; exit 1; }
        python3 -m pip install --quiet --upgrade certbot certbot-dns-cloudflare
        umask 077
        printf 'dns_cloudflare_api_token = %s\n' "$CF_TOKEN" > "$RUNNER_TEMP/cf.ini"
        certbot certonly \
          --dns-cloudflare \
          --dns-cloudflare-credentials "$RUNNER_TEMP/cf.ini" \
          --dns-cloudflare-propagation-seconds 60 \
          -d local.avarok.net \
          --non-interactive --agree-tos --register-unsafely-without-email \
          --config-dir "$RUNNER_TEMP/le" --work-dir "$RUNNER_TEMP/le-work" \
          --logs-dir "$RUNNER_TEMP/le-logs"
        rm -f "$RUNNER_TEMP/cf.ini"
        live="$RUNNER_TEMP/le/live/local.avarok.net"
        dest=citadel-workspace-internal-service/tls
        cp "$live/fullchain.pem" "$dest/local.avarok.net.crt.pem"
        cp "$live/privkey.pem"   "$dest/local.avarok.net.key.pem"
        mkdir -p "$CACHED_DIR"
        cp "$dest/local.avarok.net.crt.pem" "$dest/local.avarok.net.key.pem" "$CACHED_DIR/"
    # Saved straight after issuing, before anything else can fail, so no later step's failure
    # throws the certificate away. The key is not a secret (see below).
    - name: Cache the issued certificate for re-runs and later releases
      if: steps.decide.outputs.action == 'issue'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/agent-tls-issued
        key: ${{ steps.cached.outputs.cache-primary-key }}
    # The name, the key pair, and the expiry against this build's floor (the script says why).
    - name: Verify what will be compiled in
      shell: bash
      env:
        FLOOR_DAYS: ${{ inputs.floor-days }}
      run: node scripts/verify-agent-certificate.mjs --floor-days "$FLOOR_DAYS"
    # The key is not a secret -- it ships inside the binary by design (see
    # BUILTIN_TLS_CERT in main.rs) -- so an artifact is the right carrier.
    - uses: actions/upload-artifact@v4
      with:
        name: agent-tls
        path: citadel-workspace-internal-service/tls/
        retention-days: 1
