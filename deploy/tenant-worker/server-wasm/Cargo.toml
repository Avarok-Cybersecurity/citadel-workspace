[package]
name = "citadel-tenant-server-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
citadel_sdk = { workspace = true }
citadel-workspace-server-kernel = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
tenant-console-log = { path = "../console-log" }
toml = "0.8"

# Keep the name section through wasm-opt so a panic inside the Durable Object prints Rust
# function names instead of bare offsets; it costs size, not speed.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "-g"]
