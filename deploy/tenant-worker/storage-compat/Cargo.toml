[package]
name = "tenant-storage-compat"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native checks that a tenant Durable Object's stored accounts load under this tree's SDK"

# Native only: rusqlite stands in for the Durable Object's SQLite (the same engine), and a
# bundled C SQLite does not build for wasm32.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
citadel_sdk = { workspace = true, features = ["std", "filesystem"] }
citadel_io = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", rev = "e748bc6b54907127ae5aa1d0d55fab6bda5d120e", default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# The post-quantum sign-in settings and registration, to upgrade a stored legacy account the way a
# login against this tree's server does (tests/a_0_10_account_upgrades_to_pq_sign_in.rs).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
citadel_user = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", rev = "e748bc6b54907127ae5aa1d0d55fab6bda5d120e" }
