[package]
name = "tenant-storage-compat"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native check that the auth-record census counts the accounts this tree's SDK stores"

# Native only: rusqlite stands in for the Durable Object's SQLite (the same engine), and a
# bundled C SQLite does not build for wasm32.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
citadel_sdk = { workspace = true, features = ["std", "filesystem"] }
citadel_io = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", rev = "ce7acace", default-features = false }
tenant-auth-versions = { path = "../auth-versions" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# The SDK's account types, to build and serialize the records the census counts.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
citadel_user = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", rev = "ce7acace" }
