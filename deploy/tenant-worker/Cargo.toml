# The tenant worker's two wasm crates, built by wasm-pack and never by the parent workspace:
# `server-wasm` is the workspace server a Durable Object hosts, `proof-client` is the Citadel
# client the end-to-end proof dials it with. A workspace of their own so a native
# `cargo build --workspace` at the repository root never tries to link a wasm-bindgen cdylib.
# `auth-versions` is the pure counter behind the monitor's auth-record census (server-wasm exports it).
# `storage-compat` is native and test-only: it reads a Durable Object's stored accounts with this
# workspace's SDK (`cargo test -p tenant-storage-compat`).
[workspace]
members = ["server-wasm", "proof-client", "console-log", "storage-compat", "auth-versions"]
resolver = "3"

[workspace.dependencies]
citadel_sdk = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", branch = "master", default-features = false }
citadel_user = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", branch = "master", default-features = false }
citadel_crypt = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", branch = "master", default-features = false }
citadel-workspace-server-kernel = { path = "../../citadel-workspace-server-kernel" }
citadel-workspace-types = { path = "../../citadel-workspace-types" }
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "console"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "fmt", "env-filter", "tracing-log"] }
console_error_panic_hook = "0.1"
serde_json = "1"

[profile.release]
overflow-checks = true
opt-level = 3
lto = true
codegen-units = 1

# quinn-proto 0.11.19 plus quinn-rs/quinn#2660 (re-arm the loss-detection timer when a path
# validation fails; upstream issue #2658), which otherwise panics debug builds in
# `pto_time_and_space` when a relay fallback provokes a failed migration. A `[patch]` applies only
# in the workspace that declares it, so the SDK's and the agent's do not reach this one. Drop it
# with quinn-proto 0.11.20+ or quinn 0.12 (see https://github.com/Avarok-Cybersecurity/quinn).
[patch.crates-io]
quinn-proto = { git = "https://github.com/Avarok-Cybersecurity/quinn", rev = "5413bbaa53a1df59b25b75da5f572369a0c811f7" }
