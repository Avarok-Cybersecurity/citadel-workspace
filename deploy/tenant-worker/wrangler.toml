# A workspace server per tenant, as a Durable Object, and the site that creates them.
#
# One Worker, two faces (control/dispatch.mjs): work.avarok.net is the control plane (/api/*,
# then the static UI from [assets]); <slug>.work.avarok.net is that tenant's Durable Object.
#
# THIS FILE IS THE PRODUCTION CONFIGURATION. `deploy.sh` deploys exactly this; DEPLOY.md is the
# operator's runbook. Local runs (`wrangler dev`, the proofs, vitest) use it too and override
# only what a machine without subdomains needs, with `--var` on the command line (see
# proof-lib.mjs, proof-control.sh, vitest.config.mjs and DEPLOY.md "Local runs"):
#   --local-upstream 127.0.0.1:<port>   with routes set, wrangler dev otherwise answers every
#                            request as work.avarok.net (Host and Origin rewritten)
#   TENANT_PATH_ROUTING:on   /<slug> reaches a tenant, since localhost has no <slug>.work.avarok.net
#   TENANT_DIAGNOSTICS:on    a plain GET on a tenant answers its stats, which the proofs read
#   --assets test/fixture-ui  the site is shadowed by tenant paths there; no UI build needed
#   ALLOWED_ORIGINS, TURNSTILE_HOSTNAMES   the local origin and Turnstile's testing hostname
# proof-production.mjs overrides only Turnstile. Nothing here is a dev value.
#
# Two build outputs, neither committed, both made by `deploy.sh` (or by hand):
#   server-wasm/pkg/   build.sh     (cargo + wasm-pack)
#   ui-dist/           build-ui.sh  (the UI's production bundle)
name = "citadel-tenant"
# Avarok's Cloudflare account (zone avarok.net). Not a secret: it names the account, it grants nothing.
account_id = "91406fa25a69f484d7e0524644f13ce8"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "work.avarok.net/*", zone_name = "avarok.net" },
  { pattern = "*.work.avarok.net/*", zone_name = "avarok.net" },
]

[build]
command = ""

# The UI. Every request reaches the Worker first (run_worker_first): a tenant host must never be
# answered with the site, and the Worker adds the headers and the meta tags nginx used to
# (control/ui.mjs). Unknown paths fall back to index.html, so /create and /create/done load the app.
[assets]
directory = "./ui-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# WORKSPACE_V2, not WORKSPACE: Cloudflare refuses a migration that deletes a class while a binding
# of the name the live Worker binds to it remains, even pointed at another class (API code 10061).
# The class v2 deletes was bound as WORKSPACE, so its successor takes a new name; deploy.sh checks
# this against the live Worker first (check-do-bindings.mjs, do-binding-rule.mjs; DEPLOY.md).
[[durable_objects.bindings]]
name = "WORKSPACE_V2"
class_name = "WorkspaceServerV2"

# Append-only: a deployed tag is never edited or removed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceServer"]

# The reset (RESET-PLAN-1120): every tenant object of the old class is deleted with its storage,
# and tenants start again on a new, empty class. One deploy: the delete, the new class and the
# binding's new name (above) go together.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["WorkspaceServerV2"]
deleted_classes = ["WorkspaceServer"]

# Argon2 cost of the server's own password hashing (see server-wasm `ArgonCost`). The release
# default is 64 MiB x 10 passes x 8 lanes, sized for a server box; a Worker isolate has 128 MB in
# all and meters CPU per event, so this is the SDK's floor for a stored hash (OWASP's minimum:
# 19 MiB x 2 passes x 1 lane), the same cost clients stretch a password factor with below.
# Post-quantum accounts never reach it. It is what a legacy registration's password is hashed
# with, and the node still accepts one; below the floor the node logs "suitable for tests only"
# at every start (test/production-config.test.mjs holds it at the floor). A tenant's master
# password is NOT here: the control plane generates one per tenant and hands it to that tenant's
# object (control/provisioning.mjs).
[vars]
ARGON_LANES = "1"
ARGON_MEM_KIB = "19456"
ARGON_TIME_COST = "2"
# Post-quantum sign-in: the Argon2id cost CLIENTS stretch a password factor with (the server never
# runs it). OWASP's minimum, the SDK's floor (KsfParams::FLOOR): the browser's WASM client runs it
# when no agent is present. Raising it later applies to new password factors only.
PQ_KSF_MEM_KIB = "19456"
PQ_KSF_ITERATIONS = "2"
PQ_KSF_LANES = "1"
# The WebAuthn relying party ID every tenant's security keys are scoped to, named in every sign-in
# challenge. Permanent: a key enrolled under one ID never signs in under another. It is the ID the
# UI has always enrolled keys under on work.avarok.net and every <slug>.work.avarok.net
# (citadel-workspaces/src/lib/passkey/rp-id.ts PRODUCTION_RP_ID; a UI test holds the two equal).
PQ_SECURITY_KEY_RP_ID = "work.avarok.net"
LOG_FILTER = "citadel=warn"
# The STUN servers each tenant's node learns its NAT mapping from (server-wasm `TenantServer`):
# required, at least three distinct host:port endpoints, with no default list.
STUN_SERVERS = "stun.cloudflare.com:3478,stun1.l.google.com:19302,stun4.l.google.com:19302"
# Each tenant kernel's [identity] registration_names (server_identity/config.rs): required, no
# default. "allow_legacy" lets bare usernames register as before identities; "require_canonical"
# (every new name handle@<tenant host>) is turned on together with the UI's identity sign-up (I5).
REGISTRATION_NAMES = "allow_legacy"

# The control plane. Secrets (`wrangler secret put`), each of which leaves its routes answering
# 503 until it is set; deploy.sh refuses to deploy while any is missing:
#   TURNSTILE_SECRET       workspace creation
#   STRIPE_SECRET_KEY      paid creation, the billing portal
#   STRIPE_WEBHOOK_SECRET  the Stripe webhook
#   CITADEL_SUPPORT_MLDSA_PUBLIC_KEY  Avarok support's signed telemetry reads (control/support.mjs):
#                          the ML-DSA-65 public key `tools/telemetry-read keygen` prints. Public, but
#                          a secret so this file carries no value for it (DEPLOY.md step 4)
#   CONTROL_SERVER_KEY_SEED  work.avarok.net's own server key ("Sign in with Citadel", control/
#                          control-identity.mjs): 32 bytes from the OS CSPRNG as 64 hex characters,
#                          set once (DEPLOY.md step 4), never generated by the Worker. Unset, the
#                          control host's /.well-known/citadel answers 404 and /sign-in/* 503
# and two OPTIONAL ones deploy.sh does not require yet (DEPLOY.md step 4): without both, a
# member's GetIceServers is answered "no relay servers" (control/ice.mjs):
#   TURN_KEY_ID            the Cloudflare Realtime TURN key relay credentials are minted from
#   TURN_KEY_API_TOKEN     that key's API token; it never leaves the Worker
CONTROL_HOST = "work.avarok.net"
# When CONTROL_SERVER_KEY_SEED was made (Unix seconds): the `issued_at` of the control host's
# /.well-known/citadel. A var, not the first request's clock, so every isolate serves the same
# document; changed only together with the key (DEPLOY.md step 4).
CONTROL_SERVER_KEY_ISSUED_AT = "1794930356"
PUBLIC_ORIGIN = "https://work.avarok.net"
ALLOWED_ORIGINS = "https://work.avarok.net"
TURNSTILE_HOSTNAMES = "work.avarok.net"
# Public: the widget's site key, the one the UI's create-workspace step renders
# (citadel-workspaces lib/onboarding/turnstile.ts). Discovery (/api/admission/<slug>) hands it to
# a sign-in form when its workspace requires the check.
TURNSTILE_SITE_KEY = "0x4AAAAAAFAR1uNZSc7lTBiy"
# Citadel's own customer portal (test mode). Never the account default, which belongs to another
# product on the same Stripe account. Created with features: plan/seat change between the Team and
# Business prices, cancel at period end, payment method, invoices, return to PUBLIC_ORIGIN.
STRIPE_PORTAL_CONFIGURATION = "bpc_1UIbClCgLMkhvcEsvf9lxARd"
# Tenants are reached by subdomain only. `/<slug>` routing exists for machines without subdomains.
TENANT_PATH_ROUTING = "off"
# A tenant host answers WebSocket upgrades and nothing else (426). "on" makes a plain GET answer
# the object's stats -- connections, row counts, entitlements, a claim-code fingerprint -- for
# the local proofs; it must never be on in a deployment (test/production-config.test.mjs).
TENANT_DIAGNOSTICS = "off"
# How long a Stripe Checkout stays open (Stripe allows 1800..86400).
CHECKOUT_TTL_SECONDS = "7200"
# How long a member's minted TURN credentials work (60..86400). The object hands the same ones
# back until 80% of this has passed, and mints at most 30 per member per hour.
TURN_CREDENTIAL_TTL_SECONDS = "3600"

# The UI's meta tags (control/ui.mjs), as nginx's LOOPBACK_AGENT_ORIGIN / DEFAULT_WORKSPACE_SERVER.
# The agent on the visitor's own machine; also the one off-origin socket the CSP allows.
LOOPBACK_AGENT_ORIGIN = "wss://local.avarok.net:12345"
# Empty: a visitor is not pre-filled with a server; tenants are created, not joined, here.
DEFAULT_WORKSPACE_SERVER = ""

# The usage monitor (control/monitor.mjs): samples every active tenant's metered usage into D1,
# repairs entitlement drift and reports relay overage to Stripe's meter. Every 15 minutes, UTC.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "citadel-control"
# PLACEHOLDER. Replace with the id `wrangler d1 create citadel-control` prints (DEPLOY.md step 2)
# before the first deploy; deploy.sh refuses to deploy while it is all zeros. Local dev and the
# tests use a local database whatever this says.
database_id = "5bddb8d9-13b6-4196-8a28-7458132a04a3"
migrations_dir = "control/migrations"
